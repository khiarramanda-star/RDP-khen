name: KHEN RDP ULTIMATE
on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-11-pro
          - windows-10-pro
          - windows-10-22h2
          - windows-8-pro
          - windows-7-pro
      save_data:
        description: 'Simpan data?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
      tunnel:
        description: 'Pilih tunnel'
        required: true
        default: 'cloudflare'
        type: choice
        options:
          - cloudflare
          - tailscale
          - both
      duration:
        description: 'Durasi (jam)'
        required: true
        default: '6'
        type: choice
        options:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  DATA_PATH: C:\khen-data
  GAMING_PATH: D:\games
  BACKUP_ENABLED: ${{ github.event.inputs.save_data == 'yes' }}
  DURATION_MINUTES: ${{ github.event.inputs.duration == '1' && 60 || github.event.inputs.duration == '2' && 120 || github.event.inputs.duration == '3' && 180 || github.event.inputs.duration == '4' && 240 || github.event.inputs.duration == '5' && 300 || 360 }}
  KEEP_ALIVE_COUNT: ${{ github.event.inputs.duration == '1' && 12 || github.event.inputs.duration == '2' && 24 || github.event.inputs.duration == '3' && 36 || github.event.inputs.duration == '4' && 48 || github.event.inputs.duration == '5' && 60 || 72 }}

jobs:
  rdp:
    runs-on: ${{ 
      github.event.inputs.windows_version == 'windows-11-gaming' && 'windows-latest' ||
      github.event.inputs.windows_version == 'windows-11-pro' && 'windows-latest' ||
      github.event.inputs.windows_version == 'windows-10-pro' && 'windows-2019' ||
      github.event.inputs.windows_version == 'windows-10-22h2' && 'windows-2022' ||
      github.event.inputs.windows_version == 'windows-8-pro' && 'windows-2022' ||
      github.event.inputs.windows_version == 'windows-7-pro' && 'windows-2022'
    }}
    timeout-minutes: ${{ env.DURATION_MINUTES }}
    steps:
      - name: Cleanup
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Save Data: ${{ github.event.inputs.save_data }}"
          Write-Host "  Tunnel: ${{ github.event.inputs.tunnel }}"
          Write-Host "  Durasi: ${{ github.event.inputs.duration }} jam"
          Write-Host "========================================"
          Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          [System.GC]::Collect()
          Write-Host "✅ Cleanup done"

      - name: Restore Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ env.DATA_PATH }}
            ${{ env.GAMING_PATH }}
          key: khen-data-${{ github.run_id }}
          restore-keys: khen-data-

      - name: Restore Artifact
        if: env.BACKUP_ENABLED == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      - name: System Info
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFO"
          Write-Host "========================================"
          Write-Host "Windows : ${{ github.event.inputs.windows_version }}"
          Write-Host "Backup  : ${{ github.event.inputs.save_data }}"
          Write-Host "Tunnel  : ${{ github.event.inputs.tunnel }}"
          Write-Host "========================================"
          Get-WmiObject -Class Win32_OperatingSystem
          Get-WmiObject -Class Win32_Processor
          Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          Get-WmiObject -Class Win32_VideoController
          Get-PSDrive C
          Write-Host "========================================"

      - name: Gaming Optimization
        run: |
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          reg add "HKCU\Software\Microsoft\GameBar" /v AllowAutoGameMode /t REG_DWORD /d 1 /f
          reg add "HKCU\Software\Microsoft\GameBar" /v AutoGameModeEnabled /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" /v HwSchMode /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" /v GPU Priority /t REG_DWORD /d 8 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012008010000000 /f
          Write-Host "✅ Gaming Optimization applied"

      - name: Install Render Engine
        run: |
          choco install directx vulkan-runtime opengl vcredist-all -y 2>$null
          Write-Host "✅ Render engine installed"

      - name: Setup RDP & Random Port
        id: rdp_setup
        run: |
          Write-Host "========================================"
          Write-Host "  SETUP RDP"
          Write-Host "========================================"
          
          # Random port
          $port = Get-Random -Minimum 40000 -Maximum 49999
          Write-Host "Random Port: $port"
          
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v PortNumber /t REG_DWORD /d $port /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableWallpaper /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableWddmDriver /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableRemoteFx /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableH264 /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxDisconnectionTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveTimeout /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=$port
          
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup Administrators ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\SaveGames
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Steam
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Epic
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\GOG
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Rockstar
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Minecraft
          
          $userPath = "C:\Users\${{ env.RDP_USER }}"
          if (-not (Test-Path $userPath)) { New-Item -ItemType Directory -Force -Path $userPath }
          
          $folders = @('Desktop','Documents','Downloads','Pictures','Music','Videos','SaveGames')
          foreach ($folder in $folders) {
            $target = "${{ env.DATA_PATH }}\$folder"
            if (Test-Path "$userPath\$folder") { Remove-Item -Path "$userPath\$folder" -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J "$userPath\$folder" "$target"
          }
          
          # Simpan port ke output (biar bisa dipake step lain)
          Write-Host "RDP_PORT=$port" >> $env:GITHUB_OUTPUT
          
          $config = @"
          ============================================================
          KHEN RDP ULTIMATE
          ============================================================
          USER      : ${{ env.RDP_USER }}
          PASS      : ${{ env.RDP_PASS }}
          PORT      : $port
          DATA      : ${{ env.DATA_PATH }}
          GAMES     : ${{ env.GAMING_PATH }}
          WINDOWS   : ${{ github.event.inputs.windows_version }}
          BACKUP    : ${{ github.event.inputs.save_data }}
          TUNNEL    : ${{ github.event.inputs.tunnel }}
          DURASI    : ${{ github.event.inputs.duration }} jam
          STATUS    : ONLINE
          ============================================================
          "@
          $config | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
          
          Write-Host "✅ RDP ACTIVE (Port: $port)"

      - name: Create RDP File
        run: |
          Write-Host "========================================"
          Write-Host "  CREATE RDP FILE"
          Write-Host "========================================"
          
          $rdpContent = @"
          screen mode id:i:2
          use multimon:i:1
          desktopwidth:i:1920
          desktopheight:i:1080
          session bpp:i:16
          winposstr:s:0,1,0,0,1920,1080
          compression:i:1
          keyboardhook:i:2
          audiocapturemode:i:1
          videoplaybackmode:i:1
          connection type:i:7
          networkautodetect:i:1
          bandwidthautodetect:i:1
          displayconnectionbar:i:1
          enableworkspacereconnect:i:1
          disable wallpaper:i:1
          allow font smoothing:i:0
          allow desktop composition:i:0
          disable full window drag:i:1
          disable menu anims:i:1
          disable themes:i:1
          disable cursor setting:i:1
          bitmapcachepersistenable:i:1
          full address:s:${{ env.RDP_DOMAIN }}:${{ steps.rdp_setup.outputs.RDP_PORT }}
          username:s:${{ env.RDP_USER }}
          promptcredentialonce:i:1
          authentication level:i:0
          negotiate security layer:i:1
          enablecredsspsupport:i:1
          restricted admin mode:i:0
          remoteapplicationmode:i:0
          gatewayusagemethod:i:0
          gatewaycredentialssource:i:0
          gatewayprofileusagemethod:i:0
          use redirection server name:i:0
          alternate shell:s:
          shell working directory:s:
          drivestoredirect:s:
          redirected video capture:i:0
          redirectprinters:i:1
          redirectcomports:i:1
          redirectsmartcards:i:1
          redirectclipboard:i:1
          redirectposdevices:i:0
          audiomode:i:0
          encode redirected video capture:i:1
          redirectdirectx:i:1
          remoteapplicationprogram:s:
          remoteapplicationname:s:
          remoteapplicationcmdline:s:
          domain:s:
          prompt for credentials on client:i:0
          "@
          
          $rdpPath = "${{ env.DATA_PATH }}\KHEN-RDP.rdp"
          $rdpContent | Out-File -FilePath $rdpPath -Encoding ASCII -Force
          Write-Host "✅ RDP file created: KHEN-RDP.rdp"

      - name: Cloudflare Tunnel
        if: github.event.inputs.tunnel == 'cloudflare' || github.event.inputs.tunnel == 'both'
        id: cloudflare
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          Write-Host "========================================"
          Write-Host "  CLOUDFLARE TUNNEL"
          Write-Host "========================================"
          
          if (-not $env:CF_TOKEN) { Write-Host "⚠️ No token, skip..."; exit 0 }
          
          $port = "${{ steps.rdp_setup.outputs.RDP_PORT }}"
          Write-Host "PORT: $port"
          
          curl -s -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:$port --hostname ${{ env.RDP_DOMAIN }} --token $env:CF_TOKEN" -WindowStyle Hidden -PassThru
          
          Start-Sleep -Seconds 10
          $running = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
          if ($running) {
            Write-Host "✅ CLOUDFLARE ACTIVE"
            Write-Host "HOST: ${{ env.RDP_DOMAIN }}:$port"
          } else {
            Write-Host "❌ Cloudflare gagal"
            exit 1
          }

      - name: Tailscale VPN
        if: (github.event.inputs.tunnel == 'tailscale' || github.event.inputs.tunnel == 'both') && (steps.cloudflare.outcome == 'failure' || steps.cloudflare.conclusion == 'failure')
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  TAILSCALE VPN (FALLBACK)"
          Write-Host "========================================"
          
          if (-not $env:TS_AUTHKEY) { Write-Host "ERROR: TS_AUTHKEY not set"; exit 1 }
          
          $port = "${{ steps.rdp_setup.outputs.RDP_PORT }}"
          
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart /qn" -Wait
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10
          
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tsPath login --auth-key $env:TS_AUTHKEY
          Start-Sleep -Seconds 5
          $ip = & $tsPath ip
          
          Write-Host "✅ TAILSCALE ACTIVE (FALLBACK)"
          Write-Host "IP   : $ip"
          Write-Host "PORT : $port"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"

      - name: Keep Alive
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE AKTIF"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "  AKSES RDP:"
          Write-Host ""
          Write-Host "  Host: ${{ env.RDP_DOMAIN }}:${{ steps.rdp_setup.outputs.RDP_PORT }}"
          Write-Host "  User: ${{ env.RDP_USER }}"
          Write-Host "  Pass: ${{ env.RDP_PASS }}"
          Write-Host ""
          Write-Host "  💾 Data: ${{ env.DATA_PATH }} (PERMANEN)"
          Write-Host "  🎮 Games: ${{ env.GAMING_PATH }} (PERMANEN)"
          Write-Host ""
          Write-Host "========================================"
          
          $counter = 0
          $max = ${{ env.KEEP_ALIVE_COUNT }}
          while ($counter -lt $max) {
            $counter++
            $time = Get-Date -Format "HH:mm:ss"
            Write-Host "[$time] KHEN RDP ACTIVE $counter/$max"
            Start-Sleep -Seconds 300
          }

      - name: Upload Backup
        if: env.BACKUP_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      - name: Upload Backup (Disabled)
        if: env.BACKUP_ENABLED != 'true'
        run: |
          Write-Host "========================================"
          Write-Host "  SKIP BACKUP"
          Write-Host "========================================"
          Write-Host "Save Data = ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"

      - name: Trigger Next Run
        if: always()
        run: |
          $body = @{
            ref = "main"
            inputs = @{
              windows_version = "${{ github.event.inputs.windows_version }}"
              save_data = "${{ github.event.inputs.save_data }}"
              tunnel = "${{ github.event.inputs.tunnel }}"
              duration = "${{ github.event.inputs.duration }}"
            }
          } | ConvertTo-Json -Depth 3
          
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-khen.yml/dispatches" `
              -Method Post `
              -Headers @{
                "Authorization" = "token ${{ secrets.PAT_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } `
              -Body $body `
              -ContentType "application/json"
            Write-Host "✅ Next run triggered"
          } catch {
            Write-Host "⚠️ Gagal trigger: $($_.Exception.Message)"
          }
        continue-on-error: true
