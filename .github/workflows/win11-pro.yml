name: KHEN RDP ULTIMATE
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - windows-11-arm
  schedule:
    - cron: '0 */5 * * *'

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  ZT_NETWORK: 743993800fc54708
  DATA_PATH: C:\khen-data

jobs:
  rdp:
    runs-on: ${{ github.event.inputs.version }}
    timeout-minutes: 350
    
    steps:
    # ==========================================
    # 1. CLEANUP & PREPARE
    # ==========================================
    - name: Cleanup & Prepare
      run: |
        Write-Host "========================================"
        Write-Host "  KHEN RDP ULTIMATE"
        Write-Host "  Version: ${{ github.event.inputs.version }}"
        Write-Host "========================================"
        
        Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
        
        Write-Host "✅ Disk cleaned"
    
    # ==========================================
    # 2. RESTORE DATA (CACHE)
    # ==========================================
    - name: Restore dari Cache
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ env.DATA_PATH }}
        key: khen-data-${{ github.run_id }}
        restore-keys: khen-data-
    
    - name: Restore dari Artifact
      uses: actions/download-artifact@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
      continue-on-error: true
    
    # ==========================================
    # 3. MOUNT MEGA.NZ (50 GB)
    # ==========================================
    - name: Install Tools
      run: |
        choco install 7zip megatools rclone -y
        Write-Host "✅ Tools installed"
    
    - name: Mount Mega.nz (50 GB)
      run: |
        New-Item -ItemType Directory -Force -Path D:\mega
        rclone config create mega mega user ${{ secrets.MEGA_EMAIL }} pass ${{ secrets.MEGA_PASS }}
        Start-Process -FilePath "rclone" -ArgumentList "mount mega: D:\mega --vfs-cache-mode writes --vfs-cache-max-size 10G" -WindowStyle Hidden
        Start-Sleep -Seconds 10
        Write-Host "✅ Mega.nz mounted (50 GB)"
    
    # ==========================================
    # 4. SYSTEM INFO
    # ==========================================
    - name: System Info
      run: |
        Write-Host "========================================"
        Write-Host "  SYSTEM INFO"
        Write-Host "========================================"
        Write-Host "CPU:"
        Get-WmiObject -Class Win32_Processor
        Write-Host "RAM:"
        Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
        Write-Host "========================================"
        Write-Host "STORAGE:"
        Get-PSDrive C
        Write-Host "========================================"
        
        if (Test-Path "${{ env.DATA_PATH }}") {
          try {
            $size = (Get-ChildItem -Path ${{ env.DATA_PATH }} -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            if ($size -and $size -gt 0) {
              Write-Host "📁 DATA SIZE: $([math]::Round($size / 1MB, 2)) MB"
            } else {
              Write-Host "📁 DATA SIZE: 0 MB (kosong - first run)"
            }
          } catch {
            Write-Host "📁 DATA: Folder kosong"
          }
        } else {
          Write-Host "📁 DATA: Belum ada (first run)"
        }
        Write-Host "========================================"
    
    # ==========================================
    # 5. SETUP RDP
    # ==========================================
    - name: Setup RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        $userExists = net user ${{ env.RDP_USER }} 2>&1 | Select-String "User name"
        if ($userExists) {
          Write-Host "✅ User ${{ env.RDP_USER }} sudah ada"
        } else {
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup "Administrators" ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          Write-Host "✅ User ${{ env.RDP_USER }} created"
        }
        
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
        
        $userPath = "C:\Users\${{ env.RDP_USER }}"
        @('Desktop','Documents','Downloads','Pictures','Music','Videos') | ForEach-Object {
          $target = "${{ env.DATA_PATH }}\$_"
          if (!(Test-Path "$userPath\$_")) {
            cmd /c mklink /J "$userPath\$_" "$target" 2>$null
          }
        }
        
        @"
        ╔═══════════════════════════════════════════════════╗
        ║              KHEN RDP ULTIMATE                   ║
        ╠═══════════════════════════════════════════════════╣
        ║ HOST      : ${{ env.RDP_DOMAIN }}               ║
        ║ USER      : ${{ env.RDP_USER }}                 ║
        ║ PASS      : ${{ env.RDP_PASS }}                 ║
        ║ DATA      : ${{ env.DATA_PATH }}                ║
        ║ VERSION   : ${{ github.event.inputs.version }}  ║
        ║ STATUS    : ONLINE                              ║
        ╚═══════════════════════════════════════════════════╝
        "@ | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  ✅ KHEN RDP ACTIVE"
        Write-Host "========================================"
        Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
        Write-Host "========================================"
        Write-Host "✅ DATA AMAN! Tidak hilang walau restart"
        Write-Host "========================================"
    
    # ==========================================
    # 6. CLOUDFLARE TUNNEL
    # ==========================================
    - name: Cloudflare Tunnel
      env:
        CF_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        curl -s -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
        
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389 --hostname ${{ env.RDP_DOMAIN }} --token $env:CF_TUNNEL_TOKEN" -WindowStyle Hidden -PassThru
        
        Write-Host "✅ Tunnel aktif di: ${{ env.RDP_DOMAIN }}"
        Write-Host "⚠️  Tunggu 1-2 menit, DNS propagate"
    
    # ==========================================
    # 7. ZEROTIER (VPN)
    # ==========================================
    - name: ZeroTier VPN
      run: |
        curl -L -o ZeroTier.msi https://download.zerotier.com/dist/ZeroTier%20One.msi
        msiexec /i ZeroTier.msi /quiet /norestart
        Start-Sleep -Seconds 10
        $zt = "C:\Program Files (x86)\ZeroTier\One\zerotier-one.exe"
        & $zt -q join ${{ env.ZT_NETWORK }}
        Start-Sleep -Seconds 15
        $ip = & $zt -q listnetworks | Select-String ${{ env.ZT_NETWORK }} | ForEach-Object { ($_ -split ' ')[2] }
        Write-Host "========================================"
        Write-Host "  ✅ ZEROTIER ACTIVE"
        Write-Host "========================================"
        Write-Host "IP   : $ip"
        Write-Host "USER : ${{ env.RDP_USER }}"
        Write-Host "PASS : ${{ env.RDP_PASS }}"
        Write-Host "========================================"
    
    # ==========================================
    # 8. KEEP ALIVE
    # ==========================================
    - name: Keep Alive
      run: |
        while ($true) {
          Write-Host "$(Get-Date) - KHEN RDP ULTIMATE ACTIVE"
          Start-Sleep -Seconds 300
        }
    
    # ==========================================
    # 9. BACKUP KE ARTIFACT
    # ==========================================
    - name: Upload Backup ke Artifact
      uses: actions/upload-artifact@v4
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
        retention-days: 90
    
    # ==========================================
    # 10. TRIGGER NEXT RUN
    # ==========================================
    - name: Trigger Next Run
      run: |
        $version = "${{ github.event.inputs.version }}"
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-ultimate.yml/dispatches \
          -d "{\"ref\":\"main\", \"inputs\": {\"version\":\"$version\"}}"
      continue-on-error: true
