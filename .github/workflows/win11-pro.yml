name: KHEN RDP FULL FIX
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  ZT_NETWORK: 743993800fc54708
  DATA_PATH: C:\khen-data

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    
    steps:
    # ==========================================
    # 1. CLEANUP
    # ==========================================
    - name: Cleanup
      run: |
        Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "✅ Cleanup done"
    
    # ==========================================
    # 2. RESTORE DATA
    # ==========================================
    - name: Restore Cache
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ env.DATA_PATH }}
        key: khen-data-${{ github.run_id }}
        restore-keys: khen-data-
    
    - name: Restore Artifact
      uses: actions/download-artifact@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
      continue-on-error: true
    
    # ==========================================
    # 3. SETUP RDP
    # ==========================================
    - name: Setup RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
        net localgroup "Administrators" ${{ env.RDP_USER }} /add
        net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
        
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
        
        $userPath = "C:\Users\${{ env.RDP_USER }}"
        cmd /c mklink /J "$userPath\Desktop" "${{ env.DATA_PATH }}\Desktop" 2>$null
        cmd /c mklink /J "$userPath\Documents" "${{ env.DATA_PATH }}\Documents" 2>$null
        cmd /c mklink /J "$userPath\Downloads" "${{ env.DATA_PATH }}\Downloads" 2>$null
        
        @"
        ╔═══════════════════════════════════════════╗
        ║       KHEN RDP FULL FIX                  ║
        ╠═══════════════════════════════════════════╣
        ║ HOST   : ${{ env.RDP_DOMAIN }}           ║
        ║ USER   : ${{ env.RDP_USER }}             ║
        ║ PASS   : ${{ env.RDP_PASS }}             ║
        ║ DATA   : ${{ env.DATA_PATH }}            ║
        ║ STATUS : ONLINE                          ║
        ╚═══════════════════════════════════════════╝
        "@ | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  ✅ KHEN RDP ACTIVE"
        Write-Host "========================================"
        Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
        Write-Host "========================================"
    
    # ==========================================
    # 4. CLOUDFLARE TUNNEL (FIXED)
    # ==========================================
    - name: Cloudflare Tunnel FIX
      env:
        CF_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        Write-Host "========================================"
        Write-Host "  STARTING CLOUDFLARE TUNNEL"
        Write-Host "========================================"
        
        # Download cloudflared
        curl -s -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
        
        # Cek token
        if (-not $env:CF_TUNNEL_TOKEN) {
          Write-Host "❌ ERROR: CLOUDFLARE_TUNNEL_TOKEN not set!"
          exit 1
        }
        
        Write-Host "✅ Token found (length: $($env:CF_TUNNEL_TOKEN.Length))"
        
        # Jalankan tunnel
        $pinfo = New-Object System.Diagnostics.ProcessStartInfo
        $pinfo.FileName = ".\cloudflared.exe"
        $pinfo.Arguments = "tunnel --url tcp://localhost:3389 --hostname ${{ env.RDP_DOMAIN }} --token $env:CF_TUNNEL_TOKEN"
        $pinfo.RedirectStandardOutput = $true
        $pinfo.RedirectStandardError = $true
        $pinfo.UseShellExecute = $false
        $pinfo.CreateNoWindow = $true
        
        $p = New-Object System.Diagnostics.Process
        $p.StartInfo = $pinfo
        $p.Start() | Out-Null
        
        Start-Sleep -Seconds 10
        
        if (-not $p.HasExited) {
          Write-Host "✅ Tunnel aktif di: ${{ env.RDP_DOMAIN }}"
          Write-Host "⚠️  Tunggu 1-2 menit, DNS propagate"
          Write-Host "PID: $($p.Id)"
        } else {
          Write-Host "⚠️ Tunnel gagal start, cek error:"
          Write-Host $p.StandardError.ReadToEnd()
          exit 0
        }
    
    # ==========================================
    # 5. ZEROTIER (BACKUP)
    # ==========================================
    - name: ZeroTier
      run: |
        curl -L -o ZeroTier.msi https://download.zerotier.com/dist/ZeroTier%20One.msi
        msiexec /i ZeroTier.msi /quiet /norestart
        Start-Sleep -Seconds 10
        $zt = "C:\Program Files (x86)\ZeroTier\One\zerotier-one.exe"
        & $zt -q join ${{ env.ZT_NETWORK }}
        Start-Sleep -Seconds 15
        $ip = & $zt -q listnetworks | Select-String ${{ env.ZT_NETWORK }} | ForEach-Object { ($_ -split ' ')[2] }
        Write-Host "========================================"
        Write-Host "  ✅ ZEROTIER ACTIVE (BACKUP)"
        Write-Host "========================================"
        Write-Host "IP   : $ip"
        Write-Host "USER : ${{ env.RDP_USER }}"
        Write-Host "PASS : ${{ env.RDP_PASS }}"
        Write-Host "========================================"
    
    # ==========================================
    # 6. KEEP ALIVE
    # ==========================================
    - name: Keep Alive
      run: |
        while ($true) {
          Write-Host "$(Get-Date) - KHEN RDP FULL FIX ACTIVE"
          Start-Sleep -Seconds 300
        }
    
    # ==========================================
    # 7. BACKUP
    # ==========================================
    - name: Upload Backup
      uses: actions/upload-artifact@v4
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
        retention-days: 90
    
    # ==========================================
    # 8. TRIGGER NEXT
    # ==========================================
    - name: Trigger Next
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-full-fix.yml/dispatches \
          -d '{"ref":"main"}'
      continue-on-error: true
