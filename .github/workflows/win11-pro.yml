name: KHEN RDP
on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-10-gaming
          - windows-9-gaming
      save_data:
        description: 'Simpan data setelah session?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  DATA_PATH: C:\khen-data
  GAMING_PATH: D:\games
  BACKUP_ENABLED: ${{ github.event.inputs.save_data == 'yes' }}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      # ==========================================
      # 1. CLEANUP
      # ==========================================
      - name: Cleanup
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Save Data: ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"
          
          Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          [System.GC]::Collect()
          Write-Host "✅ Cleanup done"

      # ==========================================
      # 2. RESTORE DATA
      # ==========================================
      - name: Restore Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ env.DATA_PATH }}
            ${{ env.GAMING_PATH }}
          key: khen-data-${{ github.run_id }}
          restore-keys: khen-data-

      - name: Restore Artifact
        if: env.BACKUP_ENABLED == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      # ==========================================
      # 3. SYSTEM INFO
      # ==========================================
      - name: System Info
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFO"
          Write-Host "========================================"
          Write-Host "Windows : ${{ github.event.inputs.windows_version }}"
          Write-Host "Backup  : ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"
          Get-WmiObject -Class Win32_OperatingSystem
          Get-WmiObject -Class Win32_Processor
          Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          Get-WmiObject -Class Win32_VideoController
          Get-PSDrive C
          Write-Host "========================================"

      # ==========================================
      # 4. INSTALL RENDER ENGINE (Vulkan + OpenGL + DirectX)
      # ==========================================
      - name: Install Render Engine
        run: |
          Write-Host "========================================"
          Write-Host "  INSTALL RENDER ENGINE"
          Write-Host "========================================"
          
          # DirectX
          Write-Host "Installing DirectX..."
          choco install directx -y 2>$null
          
          # Vulkan Runtime
          Write-Host "Installing Vulkan Runtime..."
          choco install vulkan-runtime -y 2>$null
          
          # OpenGL
          Write-Host "Installing OpenGL driver..."
          choco install opengl -y 2>$null
          
          # Visual C++ Redistributable
          Write-Host "Installing VC++ Redist..."
          choco install vcredist-all -y 2>$null
          
          # GPU-Z
          Write-Host "Installing GPU-Z..."
          choco install gpu-z -y 2>$null
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  ✅ RENDER ENGINE INSTALLED"
          Write-Host "========================================"
          Write-Host "  - DirectX  : ENABLED"
          Write-Host "  - Vulkan   : ENABLED"
          Write-Host "  - OpenGL   : ENABLED"
          Write-Host "========================================"

      # ==========================================
      # 5. SETUP RDP + GAMING
      # ==========================================
      - name: Setup RDP
        run: |
          Write-Host "========================================"
          Write-Host "  SETUP RDP"
          Write-Host "========================================"
          
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v PortNumber /t REG_DWORD /d 3389 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxIdleTime /t REG_DWORD /d 0 /f
          
          # Enable GPU untuk RDP
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableWddmDriver /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableRemoteFx /t REG_DWORD /d 1 /f
          
          # Firewall
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP-UDP" dir=in action=allow protocol=UDP localport=3389
          netsh advfirewall firewall add rule name="Steam" dir=in action=allow protocol=TCP localport=27015-27030
          netsh advfirewall firewall add rule name="Game" dir=in action=allow protocol=TCP localport=27000-27050
          
          # Create user
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup Administrators ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          
          # Setup data
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\SaveGames
          
          # Setup gaming
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Steam
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Epic
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\GOG
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Rockstar
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Minecraft
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Mods
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Saves
          
          # Redirect user folders
          $userPath = "C:\Users\${{ env.RDP_USER }}"
          if (-not (Test-Path $userPath)) {
            New-Item -ItemType Directory -Force -Path $userPath
          }
          
          $folders = @('Desktop','Documents','Downloads','Pictures','Music','Videos','SaveGames')
          foreach ($folder in $folders) {
            $target = "${{ env.DATA_PATH }}\$folder"
            if (Test-Path "$userPath\$folder") {
              Remove-Item -Path "$userPath\$folder" -Force -ErrorAction SilentlyContinue
            }
            cmd /c mklink /J "$userPath\$folder" "$target"
          }
          
          # Config
          $config = @"
          ============================================================
          KHEN RDP ULTIMATE
          ============================================================
          USER      : ${{ env.RDP_USER }}
          PASS      : ${{ env.RDP_PASS }}
          DATA      : ${{ env.DATA_PATH }}
          GAMES     : ${{ env.GAMING_PATH }}
          WINDOWS   : ${{ github.event.inputs.windows_version }}
          BACKUP    : ${{ github.event.inputs.save_data }}
          STATUS    : ONLINE
          RENDER    : Vulkan | OpenGL | DirectX
          ============================================================
          "@
          $config | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  RDP GAMING ACTIVE"
          Write-Host "========================================"
          Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
          Write-Host "========================================"

      # ==========================================
      # 6. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  INSTALL TAILSCALE"
          Write-Host "========================================"
          
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Host "ERROR: TAILSCALE_AUTH_KEY not set"
            Write-Host "Dapatkan di: https://login.tailscale.com/admin/settings/keys"
            exit 1
          }
          
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart /qn" -Wait
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10
          
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
            Write-Host "ERROR: Tailscale not installed"
            exit 1
          }
          Write-Host "✅ Tailscale installed"

      - name: Login Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  LOGIN TAILSCALE"
          Write-Host "========================================"
          
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tsPath login --auth-key $env:TAILSCALE_AUTH_KEY
          Start-Sleep -Seconds 5
          
          $ip = & $tsPath ip
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  TAILSCALE ACTIVE"
          Write-Host "========================================"
          Write-Host "IP   : $ip"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"
          Write-Host "========================================"

      # ==========================================
      # 7. KEEP ALIVE
      # ==========================================
      - name: Keep Alive
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE AKTIF"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "  AKSES RDP:"
          Write-Host ""
          Write-Host "     Host: (Tailscale IP dari log di atas)"
          Write-Host "     User: ${{ env.RDP_USER }}"
          Write-Host "     Pass: ${{ env.RDP_PASS }}"
          Write-Host ""
          Write-Host "  Data   : ${{ env.DATA_PATH }} (PERMANEN)"
          Write-Host "  Games  : ${{ env.GAMING_PATH }} (PERMANEN)"
          Write-Host "  Backup : ${{ github.event.inputs.save_data }}"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Render : Vulkan | OpenGL | DirectX"
          Write-Host ""
          Write-Host "  ⏰ 6 jam tersisa..."
          Write-Host ""
          Write-Host "========================================"
          
          $counter = 0
          while ($counter -lt 72) {
            $counter++
            $time = Get-Date -Format "HH:mm:ss"
            Write-Host "[$time] KHEN RDP ACTIVE $counter"
            
            # Auto check tiap 15 menit
            if ($counter % 3 -eq 0) {
              $cpu = Get-WmiObject -Class Win32_Processor | Select-Object -ExpandProperty LoadPercentage
              $ram = Get-WmiObject -Class Win32_OperatingSystem
              $ramUsed = [math]::Round(($ram.TotalVisibleMemorySize - $ram.FreePhysicalMemory) / 1MB, 2)
              $ramTotal = [math]::Round($ram.TotalVisibleMemorySize / 1MB, 2)
              $disk = Get-PSDrive C
              $diskFree = [math]::Round($disk.Free / 1GB, 2)
              Write-Host "[$time] AUTO CHECK: CPU=$cpu% | RAM=$ramUsed/$ramTotal GB | DISK=$diskFree GB free"
            }
            
            Start-Sleep -Seconds 300
          }

      # ==========================================
      # 8. BACKUP
      # ==========================================
      - name: Upload Backup
        if: env.BACKUP_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      - name: Upload Backup (Disabled)
        if: env.BACKUP_ENABLED != 'true'
        run: |
          Write-Host "========================================"
          Write-Host "  SKIP BACKUP"
          Write-Host "========================================"
          Write-Host "Save Data = ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"

      # ==========================================
      # 9. AUTO RESTART
      # ==========================================
      - name: Trigger Next Run
        if: always()
        run: |
          $body = @{
            ref = "main"
            inputs = @{
              windows_version = "${{ github.event.inputs.windows_version }}"
              save_data = "${{ github.event.inputs.save_data }}"
            }
          } | ConvertTo-Json -Depth 3
          
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-khen.yml/dispatches" `
              -Method Post `
              -Headers @{
                "Authorization" = "token ${{ secrets.PAT_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } `
              -Body $body `
              -ContentType "application/json"
            Write-Host "✅ Next run triggered"
          } catch {
            Write-Host "⚠️ Gagal trigger: $($_.Exception.Message)"
          }
        continue-on-error: true
