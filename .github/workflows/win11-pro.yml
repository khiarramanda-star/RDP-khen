name: KHEN RDP
on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-10-gaming
          - windows-9-gaming
      save_data:
        description: 'Simpan data setelah session?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  DATA_PATH: C:\khen-data
  BACKUP_ENABLED: ${{ github.event.inputs.save_data == 'yes' }}

jobs:
  secure-rdp:
    runs-on: ${{ 
      github.event.inputs.windows_version == 'windows-11-gaming' && 'windows-latest' ||
      github.event.inputs.windows_version == 'windows-10-gaming' && 'windows-2019' ||
      github.event.inputs.windows_version == 'windows-9-gaming' && 'windows-2016'
    }}
    timeout-minutes: 360
    steps:
      # ==========================================
      # 1. CLEANUP
      # ==========================================
      - name: Cleanup
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Save Data: ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"
          
          Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ Cleanup done"

      # ==========================================
      # 2. RESTORE DATA (SAVE DATA)
      # ==========================================
      - name: Restore Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.DATA_PATH }}
          key: khen-data-${{ github.run_id }}
          restore-keys: khen-data-

      - name: Restore Artifact
        if: env.BACKUP_ENABLED == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      # ==========================================
      # 3. SYSTEM INFO
      # ==========================================
      - name: System Info
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFO"
          Write-Host "========================================"
          Write-Host "Windows : ${{ github.event.inputs.windows_version }}"
          Write-Host "Save Data: ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"
          Get-WmiObject -Class Win32_OperatingSystem
          Get-WmiObject -Class Win32_Processor
          Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          Get-WmiObject -Class Win32_VideoController
          Write-Host "========================================"

      # ==========================================
      # 4. CONFIGURE RDP
      # ==========================================
      - name: Configure RDP
        run: |
          Write-Host "========================================"
          Write-Host "  CONFIGURE RDP"
          Write-Host "========================================"
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "PortNumber" -Value 3389 -Force
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP-Tailscale-UDP" dir=in action=allow protocol=UDP localport=3389
          
          Restart-Service -Name TermService -Force
          
          Write-Host "✅ RDP configured"

      # ==========================================
      # 5. CREATE RDP USER & SETUP DATA
      # ==========================================
      - name: Create RDP User
        run: |
          Write-Host "========================================"
          Write-Host "  CREATE RDP USER"
          Write-Host "========================================"
          
          $username = "${{ env.RDP_USER }}"
          $password = "${{ env.RDP_PASS }}"
          
          $userExists = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($userExists) {
            Write-Host "User $username already exists"
          } else {
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
            Write-Host "✅ User $username created"
          }
          
          # Setup data folder (SAVE DATA)
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\SaveGames
          
          # Redirect user folders
          $userPath = "C:\Users\$username"
          if (-not (Test-Path $userPath)) {
            New-Item -ItemType Directory -Force -Path $userPath
          }
          
          $folders = @('Desktop','Documents','Downloads','Pictures','Music','Videos','SaveGames')
          foreach ($folder in $folders) {
            $target = "${{ env.DATA_PATH }}\$folder"
            if (Test-Path "$userPath\$folder") {
              Remove-Item -Path "$userPath\$folder" -Force -ErrorAction SilentlyContinue
            }
            cmd /c mklink /J "$userPath\$folder" "$target" 2>$null
          }
          
          Write-Host "✅ User & Data folder setup complete"

      # ==========================================
      # 6. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  INSTALL TAILSCALE"
          Write-Host "========================================"
          
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Host "ERROR: TAILSCALE_AUTH_KEY not set"
            Write-Host "Dapatkan di: https://login.tailscale.com/admin/settings/keys"
            exit 1
          }
          
          winget install -e --id Tailscale.Tailscale --silent --accept-package-agreements
          Start-Sleep -Seconds 10
          Write-Host "✅ Tailscale installed"

      # ==========================================
      # 7. LOGIN TAILSCALE
      # ==========================================
      - name: Login Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  LOGIN TAILSCALE"
          Write-Host "========================================"
          
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
            $tsPath = "C:\Users\runneradmin\AppData\Local\Microsoft\WindowsApps\tailscale.exe"
          }
          
          & $tsPath login --auth-key $env:TAILSCALE_AUTH_KEY
          Start-Sleep -Seconds 5
          
          $ip = & $tsPath ip
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  TAILSCALE ACTIVE"
          Write-Host "========================================"
          Write-Host "IP   : $ip"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"
          Write-Host "========================================"

      # ==========================================
      # 8. KEEP ALIVE
      # ==========================================
      - name: Keep Alive
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ACTIVE - 6 JAM"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "  AKSES RDP:"
          Write-Host ""
          Write-Host "     Host: (Tailscale IP dari log di atas)"
          Write-Host "     User: ${{ env.RDP_USER }}"
          Write-Host "     Pass: ${{ env.RDP_PASS }}"
          Write-Host ""
          Write-Host "  Data Folder: ${{ env.DATA_PATH }} (PERMANEN)"
          Write-Host "  Save Data  : ${{ github.event.inputs.save_data }}"
          Write-Host "  Windows    : ${{ github.event.inputs.windows_version }}"
          Write-Host ""
          Write-Host "========================================"
          
          $counter = 0
          while ($counter -lt 72) {
            $counter++
            $time = Get-Date -Format "HH:mm:ss"
            Write-Host "[$time] KHEN RDP ACTIVE $counter"
            Start-Sleep -Seconds 300
          }

      # ==========================================
      # 9. UPLOAD DATA (SAVE DATA)
      # ==========================================
      - name: Upload Data
        if: env.BACKUP_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      - name: Upload Data (Disabled)
        if: env.BACKUP_ENABLED != 'true'
        run: |
          Write-Host "========================================"
          Write-Host "  SKIP SAVE DATA"
          Write-Host "========================================"
          Write-Host "SAVE DATA = ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"

      # ==========================================
      # 10. AUTO RESTART
      # ==========================================
      - name: Trigger Next Run
        if: always()
        run: |
          $body = @{
            ref = "main"
            inputs = @{
              windows_version = "${{ github.event.inputs.windows_version }}"
              save_data = "${{ github.event.inputs.save_data }}"
            }
          } | ConvertTo-Json -Depth 3
          
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-khen.yml/dispatches" `
              -Method Post `
              -Headers @{
                "Authorization" = "token ${{ secrets.PAT_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } `
              -Body $body `
              -ContentType "application/json"
            Write-Host "✅ Next run triggered"
          } catch {
            Write-Host "⚠️ Gagal trigger: $($_.Exception.Message)"
          }
        continue-on-error: true
