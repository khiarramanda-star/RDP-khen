name: GAMING ULTIMATE
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pilih Windows'
        required: true
        default: 'windows-11-pro'
        type: choice
        options:
          - windows-11-pro
          - windows-10-pro
          - windows-10-22h2
      game_profile:
        description: 'Pilih profil game (buat tuning)'
        required: true
        default: 'gta5'
        type: choice
        options:
          - gta5
          - cyberpunk
          - rdr2
          - forza5
          - generic
      backup:
        description: 'Aktifkan Backup?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  DATA_PATH: C:\khen-data
  GAMING_PATH: D:\games

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      # ===========================================
      # 1. ANTI-LAG + GAME PROFILE
      # ===========================================
      - name: Optimasi Gaming
        run: |
          Write-Host "=============================="
          Write-Host "  GAMING ULTIMATE"
          Write-Host "=============================="
          Write-Host "Game : ${{ github.event.inputs.game_profile }}"
          Write-Host "=============================="

          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          reg add "HKCU\Software\Microsoft\GameBar" /v AllowAutoGameMode /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" /v HwSchMode /t REG_DWORD /d 2 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012008010000000 /f

          # Tuning per game
          if ("${{ github.event.inputs.game_profile }}" -eq "gta5") {
            reg add "HKCU\Software\Rockstar Games\Grand Theft Auto V" /v "DX12 Enabled" /t REG_DWORD /d 0 /f
            reg add "HKCU\Software\Rockstar Games\Grand Theft Auto V" /v "IgnoreSuggestedLimits" /t REG_DWORD /d 1 /f
          } elseif ("${{ github.event.inputs.game_profile }}" -eq "cyberpunk") {
            reg add "HKCU\Software\CD Projekt Red\Cyberpunk 2077" /v "DX12Enabled" /t REG_DWORD /d 1 /f
          } elseif ("${{ github.event.inputs.game_profile }}" -eq "rdr2") {
            reg add "HKCU\Software\Rockstar Games\Red Dead Redemption 2" /v "DX12Enabled" /t REG_DWORD /d 1 /f
          } elseif ("${{ github.event.inputs.game_profile }}" -eq "forza5") {
            reg add "HKCU\Software\Playground Games\Forza Horizon 5" /v "VRSEnabled" /t REG_DWORD /d 1 /f
          }
          Write-Host "Optimasi selesai"

      # ===========================================
      # 2. FREE RAM + VIRTUAL MEMORY
      # ===========================================
      - name: RAM & Pagefile
        run: |
          Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
          
          $computerSystem = Get-WmiObject -Class Win32_ComputerSystem
          $computerSystem.AutomaticManagedPagefile = $false
          $computerSystem.Put()
          $pagefile = Get-WmiObject -Class Win32_PageFileSetting
          $pagefile.InitialSize = 32768
          $pagefile.MaximumSize = 32768
          $pagefile.Put()
          Write-Host "Pagefile 32GB siap"

      # ===========================================
      # 3. RESTORE DATA
      # ===========================================
      - name: Restore Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ env.DATA_PATH }}
            ${{ env.GAMING_PATH }}
          key: gaming-${{ github.run_id }}
          restore-keys: gaming-

      - name: Restore Artifact
        if: github.event.inputs.backup == 'yes' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: gaming-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      # ===========================================
      # 4. SYSTEM INFO
      # ===========================================
      - name: System Info
        run: |
          Get-WmiObject -Class Win32_Processor
          Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          Get-WmiObject -Class Win32_VideoController

      # ===========================================
      # 5. SETUP RDP
      # ===========================================
      - name: Setup RDP
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v PortNumber /t REG_DWORD /d 3389 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableCursorShadow /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableWallpaper /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableWddmDriver /t REG_DWORD /d 1 /f

          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="Steam" dir=in action=allow protocol=TCP localport=27015-27030

          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup Administrators ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add

          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\SaveGames
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Steam
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Rockstar
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\CDProjektRed
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Forza

          $userPath = "C:\Users\${{ env.RDP_USER }}"
          if (-not (Test-Path $userPath)) { New-Item -ItemType Directory -Force -Path $userPath }
          @('Desktop','Documents','Downloads','SaveGames') | ForEach-Object {
            $target = "${{ env.DATA_PATH }}\$_"
            if (Test-Path "$userPath\$_") { Remove-Item -Path "$userPath\$_" -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J "$userPath\$_" "$target"
          }

          Write-Host "RDP Gaming siap"
          Write-Host "User: ${{ env.RDP_USER }}"
          Write-Host "Pass: ${{ env.RDP_PASS }}"

      # ===========================================
      # 6. DRIVERS & TOOLS
      # ===========================================
      - name: Install Tools
        run: |
          choco install directx vulkan-runtime vcredist-all steam -y 2>$null

      # ===========================================
      # 7. TAILSCALE
      # ===========================================
      - name: Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) { Write-Host "Error: No key"; exit 1 }
          curl -s -L -o tailscale.msi https://pkgs.tailscale.com/stable/win/tailscale-installer.msi
          msiexec /i tailscale.msi /quiet /norestart
          Start-Sleep -Seconds 15
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tsPath login --auth-key $env:TAILSCALE_AUTH_KEY
          Start-Sleep -Seconds 5
          $ip = & $tsPath ip
          Write-Host "IP Tailscale: $ip"

      # ===========================================
      # 8. KEEP ALIVE
      # ===========================================
      - name: Keep Alive
        run: |
          Write-Host "=============================="
          Write-Host "  GAMING ULTIMATE AKTIF"
          Write-Host "=============================="
          Write-Host "Install game pake Steam/Epic/etc"
          Write-Host "Data & save tetap di: ${{ env.DATA_PATH }}"
          Write-Host "Game di: ${{ env.GAMING_PATH }}"
          Write-Host "=============================="
          while ($true) {
            Write-Host "$(Get-Date -Format 'HH:mm:ss') - GAMING ACTIVE"
            Start-Sleep -Seconds 300
          }

      # ===========================================
      # 9. BACKUP
      # ===========================================
      - name: Backup
        if: github.event.inputs.backup == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: gaming-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      - name: Backup Skipped
        if: github.event.inputs.backup != 'yes'
        run: Write-Host "Backup skip"

      # ===========================================
      # 10. AUTO RESTART
      # ===========================================
      - name: Trigger Next
        if: always()
        run: |
          $body = @{
            ref = "main"
            inputs = @{
              version = "${{ github.event.inputs.version }}"
              game_profile = "${{ github.event.inputs.game_profile }}"
              backup = "${{ github.event.inputs.backup }}"
            }
          } | ConvertTo-Json -Depth 3
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gaming-ultimate.yml/dispatches" `
              -Method Post `
              -Headers @{ "Authorization" = "token ${{ secrets.PAT_TOKEN }}"; "Accept" = "application/vnd.github.v3+json" } `
              -Body $body `
              -ContentType "application/json"
          } catch {}
