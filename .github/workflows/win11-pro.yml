name: KHEN RDP ULTIMATE
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - windows-2022
          - windows-2019
          - windows-2016
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  ZT_NETWORK: 743993800fc54708
  DATA_PATH: C:\khen-data

jobs:
  rdp:
    runs-on: ${{ github.event.inputs.version || 'windows-latest' }}
    timeout-minutes: 350
    
    steps:
    - name: Cleanup
      run: |
        Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "✅ Cleanup done"
    
    - name: Restore Cache
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ env.DATA_PATH }}
        key: khen-data-${{ github.run_id }}
        restore-keys: khen-data-
    
    - name: Restore Artifact
      uses: actions/download-artifact@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
      continue-on-error: true
    
    - name: System Info
      run: |
        Write-Host "========================================"
        Write-Host "  SYSTEM INFO - ${{ github.event.inputs.version || 'schedule' }}"
        Write-Host "========================================"
        Get-WmiObject -Class Win32_OperatingSystem
        Get-WmiObject -Class Win32_Processor
        Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
        Write-Host "========================================"
    
    - name: Setup RDP
      run: |
        Write-Host "========================================"
        Write-Host "  SETUP RDP"
        Write-Host "========================================"
        
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
        
        net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
        net localgroup Administrators ${{ env.RDP_USER }} /add
        net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
        
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Projects
        
        $userPath = "C:\Users\${{ env.RDP_USER }}"
        if (-not (Test-Path $userPath)) {
          New-Item -ItemType Directory -Force -Path $userPath
        }
        
        $folders = @('Desktop','Documents','Downloads','Pictures','Music','Videos','Projects')
        foreach ($folder in $folders) {
          $target = "${{ env.DATA_PATH }}\$folder"
          if (Test-Path "$userPath\$folder") {
            Remove-Item -Path "$userPath\$folder" -Force -ErrorAction SilentlyContinue
          }
          cmd /c mklink /J "$userPath\$folder" "$target"
        }
        
        $config = @"
        ╔═══════════════════════════════════════════╗
        ║       KHEN RDP ULTIMATE                  ║
        ╠═══════════════════════════════════════════╣
        ║ USER   : ${{ env.RDP_USER }}             ║
        ║ PASS   : ${{ env.RDP_PASS }}             ║
        ║ DATA   : ${{ env.DATA_PATH }}            ║
        ║ STATUS : ONLINE                          ║
        ╚═══════════════════════════════════════════╝
        "@
        $config | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  ✅ RDP ACTIVE"
        Write-Host "========================================"
        Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
        Write-Host "========================================"
        Write-Host "✅ DATA AMAN! Tidak hilang walau restart"
        Write-Host "========================================"
    
    - name: Start Services (ZeroTier)
      run: |
        Write-Host "========================================"
        Write-Host "  START ZEROTIER SERVICE"
        Write-Host "========================================"
        
        curl -L -o ZeroTier.msi https://download.zerotier.com/dist/ZeroTier%20One.msi
        if (-not (Test-Path ZeroTier.msi)) {
          Write-Host "⚠️ Download gagal, skip..."
          exit 0
        }
        
        msiexec /i ZeroTier.msi /quiet /norestart
        Start-Sleep -Seconds 15
        
        # Start service
        net start ZeroTierOneService 2>$null
        Start-Sleep -Seconds 5
        
        $ztPaths = @(
          "C:\Program Files\ZeroTier\One\zerotier-one.exe",
          "C:\Program Files (x86)\ZeroTier\One\zerotier-one.exe"
        )
        $zt = $null
        foreach ($p in $ztPaths) {
          if (Test-Path $p) {
            $zt = $p
            break
          }
        }
        if (-not $zt) {
          Write-Host "⚠️ ZeroTier not found, skip..."
          exit 0
        }
        
        & $zt -q join ${{ env.ZT_NETWORK }}
        Start-Sleep -Seconds 10
        
        $ip = & $zt -q listnetworks | Select-String ${{ env.ZT_NETWORK }} | ForEach-Object { ($_ -split ' ')[2] }
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  ✅ ZEROTIER ACTIVE"
        Write-Host "========================================"
        Write-Host "IP   : $ip"
        Write-Host "USER : ${{ env.RDP_USER }}"
        Write-Host "PASS : ${{ env.RDP_PASS }}"
        Write-Host "========================================"
        Write-Host "⚠️  Buka ZeroTier Dashboard, Authorize device!"
        Write-Host "========================================"
    
    - name: Cloudflare Tunnel
      id: cloudflare
      continue-on-error: true
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        Write-Host "========================================"
        Write-Host "  CLOUDFLARE TUNNEL"
        Write-Host "========================================"
        
        if (-not $env:CF_TOKEN) {
          Write-Host "⚠️ No Cloudflare token, skip..."
          exit 0
        }
        
        curl -s -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
        
        Write-Host "🔄 Starting Cloudflare Tunnel..."
        $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389 --hostname ${{ env.RDP_DOMAIN }} --token $env:CF_TOKEN" -WindowStyle Hidden -PassThru
        
        Start-Sleep -Seconds 10
        
        $running = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
        if ($running) {
          Write-Host "✅ Cloudflare Tunnel aktif di: ${{ env.RDP_DOMAIN }}"
        } else {
          Write-Host "⚠️ Cloudflare gagal, fallback ke ZeroTier sudah jalan..."
          exit 1
        }
    
    - name: Backup & Keep Alive
      run: |
        Write-Host "========================================"
        Write-Host "  BACKUP & KEEP ALIVE"
        Write-Host "========================================"
        
        # Backup setiap 5 menit
        $counter = 0
        while ($true) {
          $counter++
          Write-Host "$(Get-Date) - KHEN RDP ACTIVE #$counter"
          
          # Backup tiap 5 menit
          if ($counter % 1 -eq 0) {
            Write-Host "📤 Creating backup..."
            Compress-Archive -Path ${{ env.DATA_PATH }}\* -DestinationPath C:\khen-backup.zip -Force -ErrorAction SilentlyContinue
            Write-Host "✅ Backup created: C:\khen-backup.zip"
          }
          
          Start-Sleep -Seconds 300
        }
    
    - name: Upload Backup (Final)
      uses: actions/upload-artifact@v4
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
        retention-days: 90
    
    - name: Trigger Next Run
      if: always()
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/win11-pro.yml/dispatches \
          -d '{"ref":"main"}'
      continue-on-error: true
