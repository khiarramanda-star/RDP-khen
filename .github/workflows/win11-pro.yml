name: RDP KHEN SYSTEM
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id

jobs:
  win11:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    
    steps:
    - name: Setup Environment
      run: |
        # Install Docker tanpa conflict
        sudo apt-get update
        sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io
        
        # Install QEMU & KVM
        sudo apt-get install -y qemu-kvm qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients bridge-utils virt-manager
        
        # Setup KVM
        sudo modprobe kvm
        sudo modprobe kvm_intel
        sudo chmod 666 /dev/kvm
        sudo usermod -aG docker $USER
        sudo usermod -aG kvm $USER
        
        # Cek KVM
        kvm-ok || echo "KVM not available, using software emulation"
    
    - name: Run Windows 11 Pro
      run: |
        # Jalankan Windows 11 tanpa KVM (pake software emulation)
        docker run -d --name win11 \
          -e VERSION=win11pro \
          -e USERNAME=${{ env.RDP_USER }} \
          -e PASSWORD=${{ env.RDP_PASS }} \
          -e RAM_SIZE=4G \
          -e CPU_CORES=2 \
          -e DISK_SIZE=32G \
          -e BOOT_MODE=uefi \
          -e LANGUAGE=English \
          -e KEYBOARD=en-US \
          -p 3389:3389 \
          -p 8006:8006 \
          dockurr/windows:latest
        
        echo "Menunggu Windows 11 Pro booting..."
        sleep 240
        
        docker logs win11 --tail 50
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  WINDOWS 11 PRO ACTIVE"
        Write-Host "========================================"
        Write-Host "HOST   : ${{ env.RDP_DOMAIN }}"
        Write-Host "USER   : ${{ env.RDP_USER }}"
        Write-Host "PASS   : ${{ env.RDP_PASS }}"
        Write-Host "========================================"
    
    - name: Cloudflare Tunnel
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      run: |
        curl -s -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        
        echo $CF_TOKEN | ./cloudflared tunnel login
        
        ./cloudflared tunnel delete win11-rdp -f 2>/dev/null
        ./cloudflared tunnel create win11-rdp 2>/dev/null
        ./cloudflared tunnel route dns win11-rdp ${{ env.RDP_DOMAIN }} 2>/dev/null
        
        ./cloudflared tunnel run --url tcp://localhost:3389 win11-rdp &
        
        Write-Host "Tunnel aktif di: ${{ env.RDP_DOMAIN }}"
    
    - name: Keep Alive
      run: |
        while true; do
          echo "$(date) - Windows 11 Pro Active"
          sleep 300
        done
    
    - name: Trigger Next Run
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp.yml/dispatches \
          -d '{"ref":"main"}'
      continue-on-error: true
