name: RDP - Tailscale Connector

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-11-pro
          - windows-10-pro
      save_data:
        description: 'Simpan data setelah session?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
      colab_ip:
        description: 'Masukkan IP Tailscale dari Colab (contoh: 100.64.0.1)'
        required: true
        type: string
      duration:
        description: 'Durasi session (jam)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  DATA_PATH: C:\khen-data

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(format('[60,120,180,240,300,360][{0}]', github.event.inputs.duration)) }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE"
          Write-Host "========================================"
          Write-Host "Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "Save Data: ${{ github.event.inputs.save_data }}"
          Write-Host "Durasi : ${{ github.event.inputs.duration }} jam"
          Write-Host "Colab IP: ${{ github.event.inputs.colab_ip }}"
          Write-Host "========================================"
          
          $tempPaths = @(
            "C:\Users\runneradmin\AppData\Local\Temp\*",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files\dotnet"
          )
          
          foreach ($path in $tempPaths) {
            if (Test-Path $path) {
              Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          Write-Host "Cleanup selesai"

      - name: Restore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DATA_PATH }}
          key: khen-data-${{ github.run_id }}
          restore-keys: |
            khen-data-

      - name: Restore Backup
        if: github.event.inputs.save_data == 'yes' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      - name: System Info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFO"
          Write-Host "========================================"
          
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $ram = Get-CimInstance Win32_PhysicalMemory
          $totalRAM = [math]::Round(($ram | Measure-Object Capacity -Sum).Sum / 1GB, 2)
          $disk = Get-PSDrive C
          $gpu = Get-CimInstance Win32_VideoController
          
          Write-Host "OS: $($os.Caption)"
          Write-Host "CPU: $($cpu.Name) ($($cpu.NumberOfCores) Cores)"
          Write-Host "RAM: $totalRAM GB"
          Write-Host "GPU: $($gpu.Name)"
          Write-Host "Disk Free: $([math]::Round($disk.Free / 1GB, 2)) GB"
          Write-Host "========================================"
          Write-Host "Colab Backend: ${{ github.event.inputs.colab_ip }}"
          Write-Host "========================================"

      - name: Setup RDP
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  SETUP RDP"
          Write-Host "========================================"
          
          $random = New-Object System.Random
          $rdpPort = $random.Next(30000, 49999)
          echo "RDP_PORT=$rdpPort" >> $env:GITHUB_ENV
          
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value $rdpPort -Type DWord -Force
          
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fDisableWallpaper" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fDisableMenuAnimations" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fDisableFullWindowDrag" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0 -Type DWord -Force
          
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          netsh advfirewall firewall add rule name="RDP-Random" dir=in action=allow protocol=TCP localport=$rdpPort
          
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup Administrators ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          
          $dirs = @(
            "${{ env.DATA_PATH }}",
            "${{ env.DATA_PATH }}\Desktop",
            "${{ env.DATA_PATH }}\Documents",
            "${{ env.DATA_PATH }}\Downloads",
            "${{ env.DATA_PATH }}\Pictures",
            "${{ env.DATA_PATH }}\Music",
            "${{ env.DATA_PATH }}\Videos"
          )
          
          foreach ($dir in $dirs) {
            New-Item -ItemType Directory -Force -Path $dir -ErrorAction SilentlyContinue
          }
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  RDP AKTIF"
          Write-Host "========================================"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"
          Write-Host "PORT : $rdpPort"
          Write-Host "========================================"

      - name: Gaming Optimization
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  GAMING OPTIMIZATION"
          Write-Host "========================================"
          
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          
          reg add "HKCU\Software\Microsoft\GameBar" /v AllowAutoGameMode /t REG_DWORD /d 1 /f 2>$null
          reg add "HKCU\Software\Microsoft\GameBar" /v AutoGameModeEnabled /t REG_DWORD /d 1 /f 2>$null
          
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f 2>$null
          reg add "HKCU\Control Panel\Desktop" /v MenuShowDelay /t REG_SZ /d 0 /f 2>$null
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f 2>$null
          
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" /v "GPU Priority" /t REG_DWORD /d 8 /f 2>$null
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" /v "Priority" /t REG_DWORD /d 6 /f 2>$null
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" /v "SystemResponsiveness" /t REG_DWORD /d 0 /f 2>$null
          
          Write-Host "Gaming optimization selesai"

      - name: Install Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
            Write-Host "ERROR: TAILSCALE_AUTH_KEY not set!"
            exit 1
          }
          
          Write-Host "Installing Tailscale..."
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Start-Sleep -Seconds 10
          
          Write-Host "Login Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" login --auth-key $env:TS_AUTHKEY
          Start-Sleep -Seconds 5
          
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  TAILSCALE AKTIF"
          Write-Host "========================================"
          Write-Host "GitHub Runner IP : $ip"
          Write-Host "========================================"

      - name: Connect ke Colab via Tailscale
        shell: pwsh
        env:
          COLAB_IP: ${{ github.event.inputs.colab_ip }}
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  KONEK KE COLAB"
          Write-Host "========================================"
          Write-Host "Colab IP : $env:COLAB_IP"
          Write-Host "========================================"
          
          netsh interface portproxy add v4tov4 listenport=3389 listenaddress=0.0.0.0 connectport=3390 connectaddress=$env:COLAB_IP
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  KONEK KE COLAB BERHASIL"
          Write-Host "========================================"
          Write-Host "Forwarding : 3389 -> $env:COLAB_IP:3390"
          Write-Host "========================================"

      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  RDP SESSION ACTIVE"
          Write-Host "========================================"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"
          Write-Host "PORT : $env:RDP_PORT"
          Write-Host "========================================"
          Write-Host "Akses dari localhost:$env:RDP_PORT"
          Write-Host "========================================"
          
          $totalSeconds = [int]${{ github.event.inputs.duration }} * 3600
          $elapsed = 0
          
          while ($elapsed -lt $totalSeconds) {
            $remaining = $totalSeconds - $elapsed
            $hours = [math]::Floor($remaining / 3600)
            $minutes = [math]::Floor(($remaining % 3600) / 60)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] $hours h $minutes m remaining"
            Start-Sleep -Seconds 60
            $elapsed += 60
          }

      - name: Upload Backup
        if: github.event.inputs.save_data == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90
