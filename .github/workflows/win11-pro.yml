name: KHEN RDP - Pilih Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pilih Windows 11 yang mau dipake'
        required: true
        default: 'pro-ryzen'
        type: choice
        options:
          - pro-ryzen
          - arm-basic
  schedule:
    - cron: '0 */5 * * *'

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  DATA_PATH: C:\khen-data

jobs:
  rdp:
    runs-on: ${{ github.event.inputs.version == 'arm-basic' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 350
    
    steps:
    # ===== RESTORE DATA (CACHE) =====
    - name: Restore Data dari Cache
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ env.DATA_PATH }}
        key: khen-data-${{ github.run_id }}
        restore-keys: |
          khen-data-
    
    # ===== RESTORE DARI ARTIFACT (KALO CACHE KOSONG) =====
    - name: Restore dari Artifact
      uses: actions/download-artifact@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
      continue-on-error: true
    
    # ===== RESTORE DARI GOOGLE DRIVE (KALO SEMUA KOSONG) =====
    - name: Setup Rclone & Restore dari Google Drive
      uses: AnimMouse/setup-rclone@v1
      continue-on-error: true
      with:
        rclone_conf: ${{ secrets.RCLONE_CONF }}
    
    - name: Restore dari Google Drive
      continue-on-error: true
      run: |
        mkdir ${{ env.DATA_PATH }} -Force
        rclone copy gdrive:khen-data ${{ env.DATA_PATH }} --verbose
        Write-Host "Data restored from Google Drive"
    
    # ===== INFO SPESIFIKASI =====
    - name: Info Spesifikasi
      run: |
        Write-Host "========================================"
        Write-Host "  KHEN RDP - ${{ github.event.inputs.version }}"
        Write-Host "========================================"
        Write-Host "CPU:"
        Get-WmiObject -Class Win32_Processor
        Write-Host "RAM:"
        Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
        Write-Host "========================================"
        Write-Host "DATA PATH: ${{ env.DATA_PATH }}"
        if (Test-Path "${{ env.DATA_PATH }}") {
          Write-Host "DATA SIZE: $((Get-ChildItem -Path ${{ env.DATA_PATH }} -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB) MB"
        } else {
          Write-Host "DATA: Belum ada, akan dibuat baru"
        }
        Write-Host "========================================"
    
    # ===== SETUP RDP =====
    - name: Setup RDP
      run: |
        # Enable RDP
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Cek user sudah ada atau belum
        $userExists = net user ${{ env.RDP_USER }} 2>&1 | Select-String "User name"
        if ($userExists) {
          Write-Host "User ${{ env.RDP_USER }} sudah ada, skip create"
        } else {
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup "Administrators" ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          Write-Host "User ${{ env.RDP_USER }} created"
        }
        
        # Setup folder data
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
        
        # Redirect user folders ke DATA_PATH
        $userPath = "C:\Users\${{ env.RDP_USER }}"
        if (!(Test-Path "$userPath\Desktop")) {
          cmd /c mklink /J "$userPath\Desktop" "${{ env.DATA_PATH }}\Desktop" 2>$null
        }
        if (!(Test-Path "$userPath\Documents")) {
          cmd /c mklink /J "$userPath\Documents" "${{ env.DATA_PATH }}\Documents" 2>$null
        }
        if (!(Test-Path "$userPath\Downloads")) {
          cmd /c mklink /J "$userPath\Downloads" "${{ env.DATA_PATH }}\Downloads" 2>$null
        }
        if (!(Test-Path "$userPath\Pictures")) {
          cmd /c mklink /J "$userPath\Pictures" "${{ env.DATA_PATH }}\Pictures" 2>$null
        }
        if (!(Test-Path "$userPath\Music")) {
          cmd /c mklink /J "$userPath\Music" "${{ env.DATA_PATH }}\Music" 2>$null
        }
        if (!(Test-Path "$userPath\Videos")) {
          cmd /c mklink /J "$userPath\Videos" "${{ env.DATA_PATH }}\Videos" 2>$null
        }
        
        # Simpan config
        @"
        ╔═══════════════════════════════════════════╗
        ║       KHEN RDP SYSTEM ACTIVE             ║
        ╠═══════════════════════════════════════════╣
        ║ HOST   : ${{ env.RDP_DOMAIN }}           ║
        ║ USER   : ${{ env.RDP_USER }}             ║
        ║ PASS   : ${{ env.RDP_PASS }}             ║
        ║ DATA   : ${{ env.DATA_PATH }}            ║
        ║ VERSION: ${{ github.event.inputs.version }} ║
        ║ STATUS : ONLINE                          ║
        ╚═══════════════════════════════════════════╝
        "@ | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  KHEN RDP ACTIVE"
        Write-Host "========================================"
        Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
        Write-Host "========================================"
        Write-Host "DATA AMAN! Tidak hilang walau restart"
        Write-Host "========================================"
    
    # ===== CLOUDFLARE TUNNEL =====
    - name: Cloudflare Tunnel
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      run: |
        curl -s -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
        echo $env:CF_TOKEN | .\cloudflared.exe tunnel login 2>&1 | Out-Null
        .\cloudflared.exe tunnel delete khen-rdp -f 2>&1 | Out-Null
        .\cloudflared.exe tunnel create khen-rdp 2>&1 | Out-Null
        .\cloudflared.exe tunnel route dns khen-rdp ${{ env.RDP_DOMAIN }} 2>&1 | Out-Null
        
        $credFile = Get-ChildItem C:\Users\runneradmin\.cloudflared\*.json | Select-Object -First 1
        
        @"
        tunnel: khen-rdp
        credentials-file: $($credFile.FullName)
        ingress:
          - hostname: ${{ env.RDP_DOMAIN }}
            service: tcp://localhost:3389
          - service: http_status:404
        "@ | Out-File C:\Users\runneradmin\.cloudflared\config.yml -Force
        
        Start-Process ".\cloudflared.exe" -ArgumentList "tunnel run --config C:\Users\runneradmin\.cloudflared\config.yml khen-rdp" -WindowStyle Hidden -PassThru
        
        Write-Host "Tunnel aktif di: ${{ env.RDP_DOMAIN }}"
    
    # ===== KEEP ALIVE =====
    - name: Keep Alive & Backup Otomatis
      run: |
        while ($true) {
          $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "$time - KHEN RDP ${{ github.event.inputs.version }} ACTIVE" | Out-File -FilePath "${{ env.DATA_PATH }}\heartbeat.txt" -Append
          Write-Host "[$time] KHEN RDP ACTIVE"
          Start-Sleep -Seconds 300
        }
    
    # ===== UPLOAD BACKUP KE ARTIFACT =====
    - name: Upload Backup ke Artifact
      uses: actions/upload-artifact@v4
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
        retention-days: 90
    
    # ===== UPLOAD BACKUP KE GOOGLE DRIVE =====
    - name: Upload Backup ke Google Drive
      continue-on-error: true
      run: |
        rclone copy ${{ env.DATA_PATH }} gdrive:khen-data --verbose
        Write-Host "Data backed up to Google Drive"
    
    # ===== TRIGGER NEXT RUN =====
    - name: Trigger Next Run
      run: |
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-khen.yml/dispatches \
          -d '{"ref":"main", "inputs": {"version": "${{ github.event.inputs.version }}"}}'
      continue-on-error: true
