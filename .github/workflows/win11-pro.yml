name: KHEN RDP - Mega.nz Storage
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - windows-11-arm
  schedule:
    - cron: '0 */5 * * *'

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  ZT_NETWORK: 743993800fc54708
  DATA_PATH: C:\khen-data
  MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
  MEGA_PASS: ${{ secrets.MEGA_PASS }}

jobs:
  rdp:
    runs-on: ${{ github.event.inputs.version }}
    timeout-minutes: 350
    
    steps:
    # ==========================================
    # 1. INSTALL DEPENDENCIES
    # ==========================================
    - name: Install Tools
      run: |
        choco install megatools rclone 7zip -y
        Write-Host "✅ Tools installed"

    # ==========================================
    # 2. MOUNT MEGA.nz AS DRIVE (Opsional)
    # ==========================================
    - name: Mount Mega.nz
      run: |
        # Buat folder mount
        New-Item -ItemType Directory -Force -Path D:\mega

        # Config rclone for Mega
        rclone config create mega mega user $env:MEGA_EMAIL pass $env:MEGA_PASS

        # Mount Mega as drive
        Start-Process -FilePath "rclone" -ArgumentList "mount mega: D:\mega --vfs-cache-mode writes --vfs-cache-max-size 10G" -WindowStyle Hidden

        # Tunggu mount
        Start-Sleep -Seconds 10

        Write-Host "========================================"
        Write-Host "  ✅ MEGA.nz MOUNTED"
        Write-Host "========================================"
        Write-Host "PATH: D:\mega"
        Write-Host "SIZE: 50 GB (gratis)"
        Write-Host "========================================"

    # ==========================================
    # 3. RESTORE DATA DARI MEGA
    # ==========================================
    - name: Restore dari Mega.nz
      run: |
        # Cek apakah ada backup di Mega
        megals --username $env:MEGA_EMAIL --password $env:MEGA_PASS /Root/ | Select-String "KHEN-BACKUP.zip"

        if ($?) {
          Write-Host "✅ Backup ditemukan, download..."

          # Download backup dari Mega
          megaget --username $env:MEGA_EMAIL --password $env:MEGA_PASS /Root/KHEN-BACKUP.zip

          # Extract
          Expand-Archive -Path KHEN-BACKUP.zip -DestinationPath ${{ env.DATA_PATH }} -Force

          Write-Host "✅ Data restored dari Mega.nz"
        } else {
          Write-Host "⚠️ Tidak ada backup di Mega, memulai fresh"
        }

    # ==========================================
    # 4. FREE DISK SPACE
    # ==========================================
    - name: Free Disk Space
      run: |
        Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "✅ Disk cleaned"

    # ==========================================
    # 5. ENABLE RDP
    # ==========================================
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
        net localgroup "Administrators" ${{ env.RDP_USER }} /add
        net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add

        # Buat folder di local (backup ke Mega nanti)
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads

        # Redirect user folders
        $userPath = "C:\Users\${{ env.RDP_USER }}"
        cmd /c mklink /J "$userPath\Desktop" "${{ env.DATA_PATH }}\Desktop" 2>$null
        cmd /c mklink /J "$userPath\Documents" "${{ env.DATA_PATH }}\Documents" 2>$null
        cmd /c mklink /J "$userPath\Downloads" "${{ env.DATA_PATH }}\Downloads" 2>$null

        Write-Host "========================================"
        Write-Host "  ✅ KHEN RDP ACTIVE"
        Write-Host "========================================"
        Write-Host "VERSION: ${{ github.event.inputs.version }}"
        Write-Host "USER   : ${{ env.RDP_USER }}"
        Write-Host "PASS   : ${{ env.RDP_PASS }}"
        Write-Host "DATA   : ${{ env.DATA_PATH }}"
        Write-Host "BACKUP : Mega.nz (50 GB)"
        Write-Host "========================================"

    # ==========================================
    # 6. ZEROTIER
    # ==========================================
    - name: ZeroTier
      run: |
        curl -L -o ZeroTier.msi https://download.zerotier.com/dist/ZeroTier%20One.msi
        msiexec /i ZeroTier.msi /quiet /norestart
        Start-Sleep -Seconds 10
        & "C:\Program Files (x86)\ZeroTier\One\zerotier-one.exe" -q join ${{ env.ZT_NETWORK }}
        Start-Sleep -Seconds 15
        $ip = & "C:\Program Files (x86)\ZeroTier\One\zerotier-one.exe" -q listnetworks | Select-String ${{ env.ZT_NETWORK }} | ForEach-Object { ($_ -split ' ')[2] }
        Write-Host "========================================"
        Write-Host "  ✅ ZEROTIER ACTIVE"
        Write-Host "========================================"
        Write-Host "IP   : $ip"
        Write-Host "USER : ${{ env.RDP_USER }}"
        Write-Host "PASS : ${{ env.RDP_PASS }}"
        Write-Host "========================================"

    # ==========================================
    # 7. KEEP ALIVE & BACKUP
    # ==========================================
    - name: Keep Alive & Backup
      run: |
        while ($true) {
          Write-Host "$(Get-Date) - KHEN ACTIVE"

          # Backup setiap 30 menit
          if ((Get-Date).Minute -in @(0,30)) {
            Write-Host "📤 Backup ke Mega.nz..."

            # Compress data
            Compress-Archive -Path ${{ env.DATA_PATH }}\* -DestinationPath C:\KHEN-BACKUP.zip -Force

            # Upload ke Mega
            megaput --username $env:MEGA_EMAIL --password $env:MEGA_PASS C:\KHEN-BACKUP.zip

            Write-Host "✅ Backup uploaded to Mega.nz"
          }

          Start-Sleep -Seconds 300
        }

    # ==========================================
    # 8. UPLOAD BACKUP SAAT WORKFLOW SELESAI
    # ==========================================
    - name: Upload Backup ke Mega.nz
      run: |
        # Compress data
        Compress-Archive -Path ${{ env.DATA_PATH }}\* -DestinationPath C:\KHEN-BACKUP.zip -Force

        # Upload ke Mega
        megaput --username $env:MEGA_EMAIL --password $env:MEGA_PASS C:\KHEN-BACKUP.zip

        Write-Host "✅ Backup uploaded to Mega.nz"

    # ==========================================
    # 9. TRIGGER NEXT RUN
    # ==========================================
    - name: Trigger Next
      run: |
        $version = "${{ github.event.inputs.version }}"
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-mega.yml/dispatches \
          -d "{\"ref\":\"main\", \"inputs\": {\"version\":\"$version\"}}"
      continue-on-error: true
