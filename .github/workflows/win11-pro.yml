name: KHEN RDP
on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-10-gaming
          - windows-9-gaming
      save_data:
        description: 'Simpan data setelah session?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
  schedule:
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  DATA_PATH: C:\khen-data
  GAMING_PATH: D:\games
  BACKUP_ENABLED: ${{ github.event.inputs.save_data == 'yes' }}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Cleanup
        run: |
          Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          [System.GC]::Collect()
          Write-Host "✅ Cleanup done"

      - name: Restore Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ env.DATA_PATH }}
            ${{ env.GAMING_PATH }}
          key: khen-data-${{ github.run_id }}
          restore-keys: khen-data-

      - name: Restore Artifact
        if: env.BACKUP_ENABLED == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      - name: System Info
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFO"
          Write-Host "========================================"
          Write-Host "Windows : ${{ github.event.inputs.windows_version }}"
          Write-Host "Backup  : ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"
          Get-WmiObject -Class Win32_OperatingSystem
          Get-WmiObject -Class Win32_Processor
          Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          Get-WmiObject -Class Win32_VideoController
          Get-PSDrive C
          Write-Host "========================================"

      - name: Install Render Engine
        run: |
          Write-Host "========================================"
          Write-Host "  INSTALL RENDER ENGINE"
          Write-Host "========================================"
          choco install directx -y 2>$null
          choco install vulkan-runtime -y 2>$null
          choco install opengl -y 2>$null
          choco install vcredist-all -y 2>$null
          choco install gpu-z -y 2>$null
          Write-Host "✅ Render engine installed"

      - name: UNLOCK ALL RDP FEATURES
        run: |
          Write-Host "========================================"
          Write-Host "  UNLOCK ALL RDP FEATURES"
          Write-Host "========================================"
          
          # ===== 1. ENABLE RDP =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fAllowToGetHelp /t REG_DWORD /d 1 /f
          
          # ===== 2. 64-BIT COLOR =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v ColorDepth /t REG_DWORD /d 5 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnable64BitColor /t REG_DWORD /d 1 /f
          
          # ===== 3. GPU ACCELERATION =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableWddmDriver /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableRemoteFx /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableRemoteFXAdvanced /t REG_DWORD /d 1 /f
          
          # ===== 4. VIDEO ENCODING (H.264 + HEVC) =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableH264 /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableHEVC /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v AVCHardwareEncode /t REG_DWORD /d 1 /f
          
          # ===== 5. AUDIO REDIRECT =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableAudioCapture /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableAudioRedirection /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableEncryption /t REG_DWORD /d 0 /f
          
          # ===== 6. CLIPBOARD REDIRECT =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableClipboard /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableClipboardRedirection /t REG_DWORD /d 0 /f
          
          # ===== 7. DRIVE REDIRECT =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableDriveRedirection /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableDriveRedirection /t REG_DWORD /d 1 /f
          
          # ===== 8. PRINTER REDIRECT =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisablePrinterRedirection /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnablePrinterRedirection /t REG_DWORD /d 1 /f
          
          # ===== 9. PORT REDIRECT =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisablePortRedirection /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnablePortRedirection /t REG_DWORD /d 1 /f
          
          # ===== 10. NETWORK PERFORMANCE =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fUseUDP /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v CompressionLevel /t REG_DWORD /d 2 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v SecurityLayer /t REG_DWORD /d 2 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 1 /f
          
          # ===== 11. FPS MAX =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxMonitorRefreshRate /t REG_DWORD /d 144 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v DynamicDisplayScaling /t REG_DWORD /d 1 /f
          
          # ===== 12. VISUAL EFFECTS (UNLOCK) =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableWallpaper /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableMenuAnimations /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableFullWindowDrag /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableCursorShadow /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableThemes /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableFontSmoothing /t REG_DWORD /d 0 /f
          
          # ===== 13. SESSION TIMEOUT (UNLOCK) =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxConnectionTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxDisconnectionTime /t REG_DWORD /d 0 /f
          
          # ===== 14. MULTIPLE SESSIONS =====
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fAllowMultipleSessions /t REG_DWORD /d 1 /f
          
          # ===== 15. FIREWALL =====
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP-UDP" dir=in action=allow protocol=UDP localport=3389
          netsh advfirewall firewall add rule name="Steam" dir=in action=allow protocol=TCP localport=27015-27030
          netsh advfirewall firewall add rule name="Game" dir=in action=allow protocol=TCP localport=27000-27050
          netsh advfirewall firewall add rule name="RDP-Audio" dir=in action=allow protocol=UDP localport=3389
          
          # ===== 16. CREATE USER =====
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup Administrators ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          
          # ===== 17. SETUP DATA =====
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\SaveGames
          
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Steam
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Epic
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\GOG
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Rockstar
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Minecraft
          
          $userPath = "C:\Users\${{ env.RDP_USER }}"
          if (-not (Test-Path $userPath)) {
            New-Item -ItemType Directory -Force -Path $userPath
          }
          
          $folders = @('Desktop','Documents','Downloads','Pictures','Music','Videos','SaveGames')
          foreach ($folder in $folders) {
            $target = "${{ env.DATA_PATH }}\$folder"
            if (Test-Path "$userPath\$folder") {
              Remove-Item -Path "$userPath\$folder" -Force -ErrorAction SilentlyContinue
            }
            cmd /c mklink /J "$userPath\$folder" "$target"
          }
          
          $config = @"
          ============================================================
          KHEN RDP ULTIMATE - UNLOCKED
          ============================================================
          USER      : ${{ env.RDP_USER }}
          PASS      : ${{ env.RDP_PASS }}
          DATA      : ${{ env.DATA_PATH }}
          GAMES     : ${{ env.GAMING_PATH }}
          WINDOWS   : ${{ github.event.inputs.windows_version }}
          BACKUP    : ${{ github.event.inputs.save_data }}
          ============================================================
          FEATURES UNLOCKED:
          - 64-Bit Color
          - GPU Acceleration
          - H.264 + HEVC Encoding
          - Audio Redirect
          - Clipboard Redirect
          - Drive Redirect
          - Printer Redirect
          - Port Redirect
          - FPS 144Hz
          - Multiple Sessions
          - No Timeout
          - Visual Effects ON
          ============================================================
          "@
          $config | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  RDP UNLOCKED"
          Write-Host "========================================"
          Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
          Write-Host "========================================"

      - name: Install Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
            Write-Host "ERROR: TAILSCALE_AUTH_KEY not set"
            exit 1
          }
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart /qn" -Wait
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10
          Write-Host "✅ Tailscale installed"

      - name: Login Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tsPath login --auth-key $env:TAILSCALE_AUTH_KEY
          Start-Sleep -Seconds 5
          $ip = & $tsPath ip
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  TAILSCALE ACTIVE"
          Write-Host "========================================"
          Write-Host "IP   : $ip"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"
          Write-Host "========================================"

      - name: Keep Alive
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP UNLOCKED AKTIF"
          Write-Host "========================================"
          Write-Host "  Host: (Tailscale IP dari log di atas)"
          Write-Host "  User: KhenzOfficial"
          Write-Host "  Pass: KhenzDev#12"
          Write-Host "========================================"
          Write-Host "  ALL FEATURES UNLOCKED:"
          Write-Host "  - 64-Bit Color"
          Write-Host "  - GPU Acceleration"
          Write-Host "  - H.264 + HEVC"
          Write-Host "  - Audio/Clipboard/Drive/Printer"
          Write-Host "  - 144Hz FPS"
          Write-Host "========================================"
          $counter = 0
          while ($counter -lt 72) {
            $counter++
            Write-Host "$(Get-Date) - KHEN RDP ACTIVE"
            Start-Sleep -Seconds 300
          }

      - name: Upload Backup
        if: env.BACKUP_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      - name: Upload Backup (Disabled)
        if: env.BACKUP_ENABLED != 'true'
        run: |
          Write-Host "========================================"
          Write-Host "  SKIP BACKUP"
          Write-Host "========================================"
          Write-Host "Save Data = ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"

      - name: Trigger Next Run
        if: always()
        run: |
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-khen.yml/dispatches" `
              -Method Post `
              -Headers @{
                "Authorization" = "token ${{ secrets.PAT_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } `
              -Body '{"ref":"main"}' `
              -ContentType "application/json"
            Write-Host "✅ Next run triggered"
          } catch {
            Write-Host "⚠️ Gagal trigger: $($_.Exception.Message)"
          }
        continue-on-error: true
