name: KHEN RDP ULTIMATE

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-11-pro
          - windows-10-pro
          - windows-10-22h2
          - windows-8-pro
          - windows-7-pro
      save_data:
        description: 'Simpan data setelah session?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
      tunnel:
        description: 'Pilih tunnel utama'
        required: true
        default: 'cloudflare'
        type: choice
        options:
          - cloudflare
          - tailscale
          - both
      duration:
        description: 'Durasi session (jam)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  DATA_PATH: C:\khen-data
  GAMING_PATH: D:\games

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. CLEANUP
      # ==========================================
      - name: Cleanup System
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Save Data: ${{ github.event.inputs.save_data }}"
          Write-Host "  Tunnel: ${{ github.event.inputs.tunnel }}"
          Write-Host "  Durasi: ${{ github.event.inputs.duration }} jam"
          Write-Host "========================================"
          
          # Bersihkan temp
          $tempPaths = @(
            "C:\Users\runneradmin\AppData\Local\Temp\*",
            "C:\Users\runneradmin\Downloads\*",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Windows Kits",
            "C:\Users\runneradmin\.nuget",
            "C:\Program Files\dotnet"
          )
          
          foreach ($path in $tempPaths) {
            if (Test-Path $path) {
              Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          Write-Host "✅ Cleanup selesai"

      # ==========================================
      # 3. RESTORE DATA
      # ==========================================
      - name: Restore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DATA_PATH }}
            ${{ env.GAMING_PATH }}
          key: khen-data-${{ github.run_id }}
          restore-keys: |
            khen-data-

      - name: Restore Backup
        if: github.event.inputs.save_data == 'yes' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      # ==========================================
      # 4. SYSTEM INFO
      # ==========================================
      - name: System Info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFORMATION"
          Write-Host "========================================"
          
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $cpu = Get-CimInstance -ClassName Win32_Processor
          $ram = Get-CimInstance -ClassName Win32_PhysicalMemory
          $totalRAM = [math]::Round(($ram | Measure-Object -Property Capacity -Sum).Sum / 1GB, 2)
          $disk = Get-PSDrive C
          
          Write-Host "OS: $($os.Caption)"
          Write-Host "Arch: $($os.OSArchitecture)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Cores: $($cpu.NumberOfCores)"
          Write-Host "RAM: $totalRAM GB"
          Write-Host "Disk Free: $([math]::Round($disk.Free / 1GB, 2)) GB"
          Write-Host "Disk Used: $([math]::Round($disk.Used / 1GB, 2)) GB"
          Write-Host "========================================"

      # ==========================================
      # 5. GAMING OPTIMIZATION
      # ==========================================
      - name: Gaming Optimization
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  GAMING OPTIMIZATION"
          Write-Host "========================================"
          
          # Power plan
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          
          # Registry optimizations
          $regSettings = @(
            @{Path="HKCU:\Software\Microsoft\GameBar"; Name="AllowAutoGameMode"; Value=1; Type="DWord"},
            @{Path="HKCU:\Software\Microsoft\GameBar"; Name="AutoGameModeEnabled"; Value=1; Type="DWord"},
            @{Path="HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"; Name="VisualFXSetting"; Value=2; Type="DWord"},
            @{Path="HKCU:\Control Panel\Desktop"; Name="MenuShowDelay"; Value="0"; Type="String"},
            @{Path="HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"; Name="EnableTransparency"; Value=0; Type="DWord"}
          )
          
          foreach ($reg in $regSettings) {
            try {
              if (!(Test-Path $reg.Path)) {
                New-Item -Path $reg.Path -Force -ErrorAction SilentlyContinue
              }
              Set-ItemProperty -Path $reg.Path -Name $reg.Name -Value $reg.Value -Type $reg.Type -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "⚠️ Gagal set registry: $($reg.Name)"
            }
          }
          
          Write-Host "✅ Gaming optimization selesai"

      # ==========================================
      # 6. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  INSTALL DEPENDENCIES"
          Write-Host "========================================"
          
          # Install chocolatey
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          
          # Install packages
          $packages = @('directx', 'vcredist-all')
          foreach ($pkg in $packages) {
            Write-Host "Installing $pkg..."
            choco install $pkg -y --limit-output --ignore-checksums 2>$null
          }
          
          Write-Host "✅ Dependencies installed"

      # ==========================================
      # 7. SETUP RDP
      # ==========================================
      - name: Setup RDP
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  SETUP RDP"
          Write-Host "========================================"
          
          # Random port
          $port = Get-Random -Minimum 30000 -Maximum 40000
          Write-Host "Random Port: $port"
          
          # Enable RDP
          $rdpSettings = @(
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"; Name="fDenyTSConnections"; Value=0; Type="DWord"},
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; Name="UserAuthentication"; Value=0; Type="DWord"},
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; Name="PortNumber"; Value=$port; Type="DWord"},
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; Name="MaxIdleTime"; Value=0; Type="DWord"},
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; Name="fDisableWallpaper"; Value=1; Type="DWord"},
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; Name="fDisableMenuAnimations"; Value=1; Type="DWord"},
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; Name="fDisableFullWindowDrag"; Value=1; Type="DWord"},
            @{Path="HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"; Name="fSingleSessionPerUser"; Value=0; Type="DWord"}
          )
          
          foreach ($setting in $rdpSettings) {
            try {
              if (!(Test-Path $setting.Path)) {
                New-Item -Path $setting.Path -Force -ErrorAction SilentlyContinue
              }
              Set-ItemProperty -Path $setting.Path -Name $setting.Name -Value $setting.Value -Type $setting.Type -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "⚠️ Gagal set registry: $($setting.Name)"
            }
          }
          
          # Firewall rules
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes 2>$null
          netsh advfirewall firewall add rule name="RDP-TCP" dir=in action=allow protocol=TCP localport=$port 2>$null
          netsh advfirewall firewall add rule name="RDP-UDP" dir=in action=allow protocol=UDP localport=$port 2>$null
          
          # Create user
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no 2>$null
          net localgroup Administrators ${{ env.RDP_USER }} /add 2>$null
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add 2>$null
          
          # Create directories
          $dirs = @(
            "${{ env.DATA_PATH }}",
            "${{ env.DATA_PATH }}\Desktop",
            "${{ env.DATA_PATH }}\Documents",
            "${{ env.DATA_PATH }}\Downloads",
            "${{ env.DATA_PATH }}\Pictures",
            "${{ env.GAMING_PATH }}",
            "${{ env.GAMING_PATH }}\Steam"
          )
          
          foreach ($dir in $dirs) {
            New-Item -ItemType Directory -Force -Path $dir -ErrorAction SilentlyContinue
          }
          
          # Save port
          echo "RDP_PORT=$port" >> $env:GITHUB_ENV
          
          # Show config
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  ✅ RDP ACTIVE"
          Write-Host "========================================"
          Write-Host "USER: ${{ env.RDP_USER }}"
          Write-Host "PASS: ${{ env.RDP_PASS }}"
          Write-Host "PORT: $port"
          Write-Host "========================================"

      # ==========================================
      # 8. CLOUDFLARE TUNNEL
      # ==========================================
      - name: Cloudflare Tunnel
        if: github.event.inputs.tunnel == 'cloudflare' || github.event.inputs.tunnel == 'both'
        id: cloudflare
        continue-on-error: true
        shell: pwsh
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          Write-Host "========================================"
          Write-Host "  CLOUDFLARE TUNNEL"
          Write-Host "========================================"
          
          if (-not $env:CF_TOKEN) {
            Write-Host "⚠️ No Cloudflare token, skip..."
            exit 0
          }
          
          Write-Host "Downloading Cloudflared..."
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "cloudflared.exe" -UseBasicParsing
          
          Write-Host "Starting tunnel..."
          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = ".\cloudflared.exe"
          $pinfo.Arguments = "tunnel --url tcp://localhost:${{ env.RDP_PORT }} --hostname ${{ env.RDP_DOMAIN }} --token $env:CF_TOKEN"
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError = $true
          $pinfo.UseShellExecute = $false
          $pinfo.CreateNoWindow = $true
          
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $pinfo
          $p.Start() | Out-Null
          
          Start-Sleep -Seconds 10
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  ✅ CLOUDFLARE TUNNEL ACTIVE"
          Write-Host "========================================"
          Write-Host "HOST: ${{ env.RDP_DOMAIN }}"
          Write-Host "PORT: ${{ env.RDP_PORT }}"
          Write-Host "USER: ${{ env.RDP_USER }}"
          Write-Host "PASS: ${{ env.RDP_PASS }}"
          Write-Host "========================================"

      # ==========================================
      # 9. TAILSCALE
      # ==========================================
      - name: Tailscale VPN
        if: (github.event.inputs.tunnel == 'tailscale' || github.event.inputs.tunnel == 'both') && (steps.cloudflare.outcome == 'failure' || steps.cloudflare.conclusion == 'failure')
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  TAILSCALE VPN"
          Write-Host "========================================"
          
          if (-not $env:TS_AUTHKEY) {
            Write-Host "ERROR: TAILSCALE_AUTH_KEY not set"
            exit 1
          }
          
          Write-Host "Installing Tailscale..."
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          Start-Sleep -Seconds 10
          
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $tsPath) {
            & $tsPath login --auth-key $env:TS_AUTHKEY
            Start-Sleep -Seconds 5
            $ip = & $tsPath ip
            Write-Host "Tailscale IP: $ip"
          }
          
          Write-Host "========================================"
          Write-Host "  ✅ TAILSCALE ACTIVE"
          Write-Host "========================================"

      # ==========================================
      # 10. KEEP ALIVE
      # ==========================================
      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  🔥 KHEN RDP ULTIMATE ACTIVE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "RDP ACCESS:"
          Write-Host "  User: ${{ env.RDP_USER }}"
          Write-Host "  Pass: ${{ env.RDP_PASS }}"
          Write-Host "  Port: ${{ env.RDP_PORT }}"
          Write-Host ""
          Write-Host "  Cloudflare: ${{ env.RDP_DOMAIN }} (if active)"
          Write-Host "  Duration: ${{ github.event.inputs.duration }} jam"
          Write-Host "========================================"
          
          $durationHours = [int]${{ github.event.inputs.duration }}
          $totalSeconds = $durationHours * 3600
          $elapsed = 0
          
          while ($elapsed -lt $totalSeconds) {
            $remaining = $totalSeconds - $elapsed
            $hours = [math]::Floor($remaining / 3600)
            $minutes = [math]::Floor(($remaining % 3600) / 60)
            $seconds = $remaining % 60
            
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP ACTIVE - Remaining: ${hours}h ${minutes}m ${seconds}s"
            
            # System stats every 5 minutes
            if ($elapsed % 300 -eq 0) {
              try {
                $cpu = (Get-CimInstance -ClassName Win32_Processor).LoadPercentage
                $ram = Get-CimInstance -ClassName Win32_OperatingSystem
                $ramUsed = [math]::Round(($ram.TotalVisibleMemorySize - $ram.FreePhysicalMemory) / 1MB, 2)
                $ramTotal = [math]::Round($ram.TotalVisibleMemorySize / 1MB, 2)
                Write-Host "  📊 CPU: $cpu% | RAM: $ramUsed/$ramTotal GB"
              } catch {
                # Skip if error
              }
            }
            
            Start-Sleep -Seconds 10
            $elapsed += 10
          }
          
          Write-Host "========================================"
          Write-Host "  ⏰ SESSION COMPLETED"
          Write-Host "========================================"

      # ==========================================
      # 11. BACKUP
      # ==========================================
      - name: Upload Backup
        if: github.event.inputs.save_data == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      # ==========================================
      # 12. AUTO RESTART
      # ==========================================
      - name: Auto Restart
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "========================================"
          Write-Host "  AUTO RESTART"
          Write-Host "========================================"
          
          $body = @{
            ref = "main"
            inputs = @{
              windows_version = "${{ github.event.inputs.windows_version }}"
              save_data = "${{ github.event.inputs.save_data }}"
              tunnel = "${{ github.event.inputs.tunnel }}"
              duration = "${{ github.event.inputs.duration }}"
            }
          } | ConvertTo-Json -Depth 3
          
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches" `
              -Method Post `
              -Headers @{
                "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } `
              -Body $body `
              -ContentType "application/json"
            Write-Host "✅ Auto restart triggered"
          } catch {
            Write-Host "⚠️ Auto restart failed: $($_.Exception.Message)"
          }
