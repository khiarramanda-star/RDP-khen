name: RYZEN GAMING
on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows Gaming'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-10-gaming
          - windows-9-gaming
      backup:
        description: 'Aktifkan Backup?'
        required: true
        default: 'no'
        type: choice
        options:
          - yes
          - no
  schedule:
    - cron: '13 3,9,15,21 * * *'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  DATA_PATH: C:\khen-data
  GAMING_PATH: D:\games
  BACKUP_ENABLED: ${{ github.event.inputs.backup == 'yes' }}

jobs:
  gaming:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Free Storage & RAM
        run: |
          Write-Host "========================================"
          Write-Host "  RYZEN GAMING ULTIMATE"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Backup : ${{ github.event.inputs.backup }}"
          Write-Host "========================================"
          Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path C:\Windows\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          [System.GC]::Collect()
          Write-Host "Storage & RAM freed"

      - name: Optimasi RAM & Pagefile
        run: |
          Write-Host "========================================"
          Write-Host "  OPTIMASI RAM & VIRTUAL MEMORY"
          Write-Host "========================================"
          Stop-Service -Name SysMain -Force -ErrorAction SilentlyContinue
          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          Stop-Service -Name XboxNetApiSvc -Force -ErrorAction SilentlyContinue
          Stop-Service -Name DiagTrack -Force -ErrorAction SilentlyContinue
          $computerSystem = Get-WmiObject -Class Win32_ComputerSystem
          $computerSystem.AutomaticManagedPagefile = $false
          $computerSystem.Put()
          $pagefile = Get-WmiObject -Class Win32_PageFileSetting
          $pagefile.InitialSize = 65536
          $pagefile.MaximumSize = 65536
          $pagefile.Put()
          Write-Host "Pagefile 64GB siap"

      - name: FPS Boost
        run: |
          Write-Host "========================================"
          Write-Host "  FPS BOOST & GAMING OPTIMIZATION"
          Write-Host "========================================"
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          reg add "HKCU\Software\Microsoft\GameBar" /v AllowAutoGameMode /t REG_DWORD /d 1 /f
          reg add "HKCU\Software\Microsoft\GameBar" /v AutoGameModeEnabled /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" /v HwSchMode /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" /v GPU Priority /t REG_DWORD /d 8 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" /v Priority /t REG_DWORD /d 6 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" /v SystemResponsiveness /t REG_DWORD /d 0 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012008010000000 /f
          reg add "HKCU\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f
          reg add "HKCU\Control Panel\Desktop" /v MenuShowDelay /t REG_SZ /d 0 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v TaskbarAnimations /t REG_DWORD /d 0 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications" /v GlobalUserDisabled /t REG_DWORD /d 1 /f
          Write-Host "FPS Boost applied"

      - name: Restore Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ${{ env.DATA_PATH }}
            ${{ env.GAMING_PATH }}
          key: gaming-${{ github.run_id }}
          restore-keys: gaming-

      - name: Restore Artifact
        if: env.BACKUP_ENABLED == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: gaming-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      - name: System Info
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFO"
          Write-Host "========================================"
          Write-Host "Windows : ${{ github.event.inputs.windows_version }}"
          Write-Host "Backup  : ${{ github.event.inputs.backup }}"
          Write-Host "========================================"
          Get-WmiObject -Class Win32_Processor
          Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          Get-WmiObject -Class Win32_VideoController
          Get-PSDrive C
          Write-Host "========================================"

      - name: Setup RDP
        run: |
          Write-Host "========================================"
          Write-Host "  SETUP RDP"
          Write-Host "========================================"
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v PortNumber /t REG_DWORD /d 3389 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxIdleTime /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableCursorShadow /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableWallpaper /t REG_DWORD /d 1 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableWddmDriver /t REG_DWORD /d 1 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup Administrators ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
          New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\SaveGames
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Steam
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Epic
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\GOG
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Rockstar
          New-Item -ItemType Directory -Force -Path ${{ env.GAMING_PATH }}\Minecraft
          $userPath = "C:\Users\${{ env.RDP_USER }}"
          if (-not (Test-Path $userPath)) { New-Item -ItemType Directory -Force -Path $userPath }
          $folders = @('Desktop','Documents','Downloads','Pictures','Music','Videos','SaveGames')
          foreach ($folder in $folders) {
            $target = "${{ env.DATA_PATH }}\$folder"
            if (Test-Path "$userPath\$folder") { Remove-Item -Path "$userPath\$folder" -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J "$userPath\$folder" "$target"
          }
          $config = @"
          ============================================================
          RYZEN GAMING ULTIMATE
          ============================================================
          USER      : ${{ env.RDP_USER }}
          PASS      : ${{ env.RDP_PASS }}
          DATA      : ${{ env.DATA_PATH }}
          GAMES     : ${{ env.GAMING_PATH }}
          WINDOWS   : ${{ github.event.inputs.windows_version }}
          BACKUP    : ${{ github.event.inputs.backup }}
          STATUS    : ONLINE
          OPTIMASI  : 64GB Pagefile, FPS Boost, Gaming Mode
          ============================================================
          "@
          $config | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  RDP GAMING ACTIVE"
          Write-Host "========================================"
          Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
          Write-Host "========================================"

      - name: Install Gaming Tools
        run: |
          Write-Host "========================================"
          Write-Host "  INSTALL GAMING TOOLS"
          Write-Host "========================================"
          choco install directx -y 2>$null
          choco install vcredist-all -y 2>$null
          choco install vulkan-runtime -y 2>$null
          curl -L -o steam.exe https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe
          Start-Process -FilePath "steam.exe" -ArgumentList "/S" -Wait
          Write-Host "✅ Gaming tools installed"

      - name: Tailscale VPN
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  TAILSCALE VPN"
          Write-Host "========================================"
          if (-not $env:TAILSCALE_AUTH_KEY) { Write-Host "ERROR: TAILSCALE_AUTH_KEY not set"; exit 1 }
          curl -s -L -o tailscale.msi https://pkgs.tailscale.com/stable/win/tailscale-installer.msi
          msiexec /i tailscale.msi /quiet /norestart
          Start-Sleep -Seconds 15
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          & $tsPath login --auth-key $env:TAILSCALE_AUTH_KEY
          Start-Sleep -Seconds 5
          $ip = & $tsPath ip
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  TAILSCALE ACTIVE"
          Write-Host "========================================"
          Write-Host "IP   : $ip"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"
          Write-Host "========================================"

      - name: Keep Alive & Auto Check
        run: |
          Write-Host "========================================"
          Write-Host "  RYZEN GAMING ULTIMATE AKTIF"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "  AKSES RDP:"
          Write-Host ""
          Write-Host "     Host: (Tailscale IP dari log di atas)"
          Write-Host "     User: ${{ env.RDP_USER }}"
          Write-Host "     Pass: ${{ env.RDP_PASS }}"
          Write-Host ""
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Backup : ${{ github.event.inputs.backup }}"
          Write-Host "  Data   : ${{ env.DATA_PATH }} (PERMANEN)"
          Write-Host "  Games  : ${{ env.GAMING_PATH }} (PERMANEN)"
          Write-Host ""
          Write-Host "  OPTIMASI:"
          Write-Host "  - 64GB Pagefile"
          Write-Host "  - FPS Boost Registry"
          Write-Host "  - Gaming Mode ON"
          Write-Host "  - Network Optimizer"
          Write-Host ""
          Write-Host "  ⏰ 4 jam tersisa..."
          Write-Host ""
          Write-Host "========================================"
          $counter = 0
          while ($counter -lt 48) {
            $counter++
            $time = Get-Date -Format "HH:mm:ss"
            Write-Host "[$time] RYZEN GAMING ACTIVE $counter"
            if ($counter % 3 -eq 0) {
              $cpu = Get-WmiObject -Class Win32_Processor | Select-Object -ExpandProperty LoadPercentage
              $ram = Get-WmiObject -Class Win32_OperatingSystem
              $ramUsed = [math]::Round(($ram.TotalVisibleMemorySize - $ram.FreePhysicalMemory) / 1MB, 2)
              $ramTotal = [math]::Round($ram.TotalVisibleMemorySize / 1MB, 2)
              $disk = Get-PSDrive C
              $diskFree = [math]::Round($disk.Free / 1GB, 2)
              Write-Host "[$time] AUTO CHECK: CPU=$cpu% | RAM=$ramUsed/$ramTotal GB | DISK=$diskFree GB free"
              if ($counter % 6 -eq 0) {
                Write-Host "[$time] 📤 Auto Backup..."
                Compress-Archive -Path ${{ env.DATA_PATH }}\* -DestinationPath C:\auto-backup-$counter.zip -Force -ErrorAction SilentlyContinue
                Write-Host "[$time] ✅ Backup saved: C:\auto-backup-$counter.zip"
              }
            }
            Start-Sleep -Seconds 300
          }

      - name: Upload Backup
        if: env.BACKUP_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gaming-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      - name: Upload Backup (Disabled)
        if: env.BACKUP_ENABLED != 'true'
        run: |
          Write-Host "========================================"
          Write-Host "  SKIP BACKUP"
          Write-Host "========================================"
          Write-Host "BACKUP = ${{ github.event.inputs.backup }}"
          Write-Host "========================================"

      - name: Trigger Next Run
        if: always()
        run: |
          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gaming.yml/dispatches" `
              -Method Post `
              -Headers @{
                "Authorization" = "token ${{ secrets.PAT_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } `
              -Body '{"ref":"main"}' `
              -ContentType "application/json"
            Write-Host "Next run triggered"
          } catch {
            Write-Host "Gagal trigger: $($_.Exception.Message)"
          }
        continue-on-error: true
