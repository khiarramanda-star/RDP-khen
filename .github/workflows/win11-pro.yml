name: Windows 11 Pro - RDP
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id

jobs:
  win11:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    
    steps:
    - name: Setup KVM & Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io qemu-kvm qemu-system-x86 virt-manager
        sudo modprobe kvm
        sudo modprobe kvm_intel
        sudo chmod 666 /dev/kvm
        sudo systemctl start docker
        sudo systemctl enable docker
    
    - name: Install Windows 11 Pro (Docker)
      run: |
        # Pull image Windows 11
        docker run -d --name win11 \
          --privileged \
          -e VERSION=win11pro \
          -e USERNAME=${{ env.RDP_USER }} \
          -e PASSWORD=${{ env.RDP_PASS }} \
          -e RAM_SIZE=8G \
          -e CPU_CORES=4 \
          -e DISK_SIZE=64G \
          -e BOOT_MODE=uefi \
          -e LANGUAGE=English \
          -e KEYBOARD=en-US \
          -p 3389:3389 \
          -p 8006:8006 \
          dockurr/windows:latest
        
        # Tunggu Windows 11 boot (4-5 menit)
        echo "Menunggu Windows 11 Pro booting..."
        sleep 240
        
        # Cek status
        docker logs win11 --tail 30
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  WINDOWS 11 PRO ACTIVE"
        Write-Host "========================================"
        Write-Host "HOST   : ${{ env.RDP_DOMAIN }}"
        Write-Host "USER   : ${{ env.RDP_USER }}"
        Write-Host "PASS   : ${{ env.RDP_PASS }}"
        Write-Host "========================================"
    
    - name: Cloudflare Tunnel
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      run: |
        curl -s -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        
        echo $CF_TOKEN | ./cloudflared tunnel login
        
        ./cloudflared tunnel delete win11-rdp -f 2>/dev/null
        ./cloudflared tunnel create win11-rdp 2>/dev/null
        ./cloudflared tunnel route dns win11-rdp ${{ env.RDP_DOMAIN }} 2>/dev/null
        
        ./cloudflared tunnel run --url tcp://localhost:3389 win11-rdp &
        
        Write-Host "Tunnel aktif di: ${{ env.RDP_DOMAIN }}"
    
    - name: Keep Alive
      run: |
        while true; do
          echo "$(date) - Windows 11 Pro Active"
          sleep 300
        done
