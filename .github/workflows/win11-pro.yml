name: KHEN RDP ULTIMATE
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pilih versi Windows'
        required: true
        default: 'pro-ryzen'
        type: choice
        options:
          - pro-ryzen
          - arm-basic
      storage:
        description: 'Pake Google Drive?'
        required: true
        default: 'no'
        type: choice
        options:
          - yes
          - no
  schedule:
    - cron: '0 */5 * * *'

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  DATA_PATH: C:\khen-data
  BACKUP_PATH: D:\backup

jobs:
  rdp:
    runs-on: ${{ github.event.inputs.version == 'arm-basic' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 350
    
    steps:
    # ==========================================
    # 1. PREPARATION & CLEANUP
    # ==========================================
    - name: Prepare Environment
      run: |
        Write-Host "========================================"
        Write-Host "  KHEN RDP ULTIMATE - ${{ github.event.inputs.version }}"
        Write-Host "========================================"
        Write-Host "Storage : ${{ github.event.inputs.storage }}"
        Write-Host "========================================"
        
        # Bersihin disk
        Remove-Item -Path C:\Users\runneradmin\AppData\Local\Temp\* -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path C:\Users\runneradmin\.nuget -Recurse -Force -ErrorAction SilentlyContinue
        
        Write-Host "Disk cleaned"
    
    # ==========================================
    # 2. RESTORE DATA (CACHE PRIORITY)
    # ==========================================
    - name: Restore dari Cache
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ env.DATA_PATH }}
        key: khen-data-${{ github.run_id }}
        restore-keys: |
          khen-data-
    
    - name: Restore dari Artifact
      uses: actions/download-artifact@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
      continue-on-error: true
    
    # ==========================================
    # 3. GOOGLE DRIVE (OPSIONAL)
    # ==========================================
    - name: Setup Rclone
      if: github.event.inputs.storage == 'yes'
      uses: AnimMouse/setup-rclone@v1
      continue-on-error: true
    
    - name: Restore dari Google Drive
      if: github.event.inputs.storage == 'yes'
      continue-on-error: true
      run: |
        if (Test-Path "C:\Users\runneradmin\AppData\Roaming\rclone\rclone.conf") {
          mkdir ${{ env.DATA_PATH }} -Force
          rclone copy gdrive:khen-data ${{ env.DATA_PATH }} --verbose 2>&1
          Write-Host "✅ Restore dari Google Drive berhasil"
        } else {
          Write-Host "⚠️ rclone.conf tidak ditemukan, skip Google Drive"
        }
    
    # ==========================================
    # 4. INFO SPESIFIKASI
    # ==========================================
    - name: System Info
      run: |
        Write-Host "========================================"
        Write-Host "  SYSTEM INFO"
        Write-Host "========================================"
        Write-Host "CPU:"
        Get-WmiObject -Class Win32_Processor
        Write-Host "RAM:"
        Get-WmiObject -Class Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
        Write-Host "OS:"
        Get-WmiObject -Class Win32_OperatingSystem
        Write-Host "========================================"
        
        if (Test-Path "${{ env.DATA_PATH }}") {
          $size = (Get-ChildItem -Path ${{ env.DATA_PATH }} -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          if ($size) {
            Write-Host "📁 DATA SIZE: $([math]::Round($size / 1MB, 2)) MB"
          } else {
            Write-Host "📁 DATA SIZE: 0 MB (kosong)"
          }
        } else {
          Write-Host "📁 DATA: Belum ada"
        }
        Write-Host "========================================"
    
    # ==========================================
    # 5. SETUP RDP
    # ==========================================
    - name: Setup RDP
      run: |
        # Enable RDP
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # Create user (kalo belum ada)
        $userExists = net user ${{ env.RDP_USER }} 2>&1 | Select-String "User name"
        if ($userExists) {
          Write-Host "✅ User ${{ env.RDP_USER }} sudah ada"
        } else {
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no
          net localgroup "Administrators" ${{ env.RDP_USER }} /add
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add
          Write-Host "✅ User ${{ env.RDP_USER }} created"
        }
        
        # Setup folder data
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Desktop
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Documents
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Downloads
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Pictures
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Music
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Videos
        New-Item -ItemType Directory -Force -Path ${{ env.DATA_PATH }}\Projects
        
        # Redirect user folders
        $userPath = "C:\Users\${{ env.RDP_USER }}"
        @('Desktop','Documents','Downloads','Pictures','Music','Videos') | ForEach-Object {
          $target = "${{ env.DATA_PATH }}\$_"
          if (!(Test-Path "$userPath\$_")) {
            cmd /c mklink /J "$userPath\$_" "$target" 2>$null
          }
        }
        
        # Simpan config lengkap
        @"
        ╔═══════════════════════════════════════════════════╗
        ║              KHEN RDP ULTIMATE                   ║
        ╠═══════════════════════════════════════════════════╣
        ║ HOST      : ${{ env.RDP_DOMAIN }}               ║
        ║ USER      : ${{ env.RDP_USER }}                 ║
        ║ PASS      : ${{ env.RDP_PASS }}                 ║
        ║ DATA      : ${{ env.DATA_PATH }}                ║
        ║ VERSION   : ${{ github.event.inputs.version }}  ║
        ║ STORAGE   : ${{ github.event.inputs.storage }}  ║
        ║ STATUS    : ONLINE                              ║
        ╚═══════════════════════════════════════════════════╝
        "@ | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
        
        Write-Host ""
        Write-Host "========================================"
        Write-Host "  ✅ KHEN RDP ULTIMATE ACTIVE"
        Write-Host "========================================"
        Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
        Write-Host "========================================"
        Write-Host "✅ DATA AMAN! Tidak hilang walau restart"
        Write-Host "========================================"
    
    # ==========================================
    # 6. CLOUDFLARE TUNNEL (DENGAN RETRY)
    # ==========================================
    - name: Cloudflare Tunnel
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      run: |
        curl -s -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
        
        # Login dengan retry
        $retry = 0
        $success = $false
        while ($retry -lt 3 -and !$success) {
          try {
            echo $env:CF_TOKEN | .\cloudflared.exe tunnel login 2>&1 | Out-Null
            $success = $true
            Write-Host "✅ Tunnel login berhasil"
          } catch {
            $retry++
            Write-Host "⚠️ Retry $retry/3..."
            Start-Sleep -Seconds 5
          }
        }
        
        # Hapus tunnel lama
        .\cloudflared.exe tunnel delete khen-ultimate -f 2>&1 | Out-Null
        
        # Buat tunnel baru
        .\cloudflared.exe tunnel create khen-ultimate 2>&1 | Out-Null
        
        # Route ke domain
        .\cloudflared.exe tunnel route dns khen-ultimate ${{ env.RDP_DOMAIN }} 2>&1 | Out-Null
        
        # Cari credentials
        $credFile = Get-ChildItem C:\Users\runneradmin\.cloudflared\*.json | Select-Object -First 1
        
        # Config
        @"
        tunnel: khen-ultimate
        credentials-file: $($credFile.FullName)
        ingress:
          - hostname: ${{ env.RDP_DOMAIN }}
            service: tcp://localhost:3389
          - service: http_status:404
        "@ | Out-File C:\Users\runneradmin\.cloudflared\config.yml -Force
        
        # Jalankan tunnel
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel run --config C:\Users\runneradmin\.cloudflared\config.yml khen-ultimate" -WindowStyle Hidden -PassThru
        
        Write-Host "✅ Tunnel aktif di: ${{ env.RDP_DOMAIN }}"
    
    # ==========================================
    # 7. WEB STATUS
    # ==========================================
    - name: Web Status
      run: |
        New-Item -ItemType Directory -Force -Path "${{ env.DATA_PATH }}\web"
        @"
        <!DOCTYPE html>
        <html>
        <head><title>KHEN RDP Status</title>
        <style>
        body { font-family: 'Courier New',monospace; background:#0a0a0a; color:#00ff00; text-align:center; padding:50px; }
        .box { background:#1a1a1a; padding:40px; border-radius:15px; border:2px solid #00ff00; max-width:600px; margin:auto; }
        .status { color:#00ff00; font-size:52px; }
        .host { color:#00ffaa; font-size:24px; }
        .user { color:#ffaa00; }
        .pass { color:#ff4444; }
        .footer { margin-top:30px; color:#444; font-size:12px; }
        </style>
        </head>
        <body>
        <div class="box">
        <div class="status">✅ KHEN RDP ACTIVE</div>
        <div class="host">${{ env.RDP_DOMAIN }}</div>
        <p><span class="user">User: ${{ env.RDP_USER }}</span></p>
        <p><span class="pass">Pass: ${{ env.RDP_PASS }}</span></p>
        <p>Data: Persistent (TIDAK HILANG)</p>
        <div class="footer">KHEN ULTIMATE v3.0 | 24/7</div>
        </div>
        </body>
        </html>
        "@ | Out-File -FilePath "${{ env.DATA_PATH }}\web\index.html" -Force
        
        # Jalankan web server pake python
        Start-Process -FilePath "python" -ArgumentList "-m http.server 8080 --directory ${{ env.DATA_PATH }}\web" -WindowStyle Hidden
        Write-Host "✅ Web status running on port 8080"
    
    # ==========================================
    # 8. KEEP ALIVE + HEARTBEAT
    # ==========================================
    - name: Keep Alive
      run: |
        $counter = 0
        while ($true) {
          $counter++
          $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "$time - KHEN ULTIMATE #$counter" | Out-File -FilePath "${{ env.DATA_PATH }}\heartbeat.txt" -Append
          Write-Host "[$time] KHEN ULTIMATE #$counter"
          Start-Sleep -Seconds 300
        }
    
    # ==========================================
    # 9. BACKUP (ARTIFACT + GOOGLE DRIVE)
    # ==========================================
    - name: Upload Backup ke Artifact
      uses: actions/upload-artifact@v4
      with:
        name: khen-data-backup
        path: ${{ env.DATA_PATH }}
        retention-days: 90
    
    - name: Upload Backup ke Google Drive
      if: github.event.inputs.storage == 'yes'
      continue-on-error: true
      run: |
        if (Test-Path "C:\Users\runneradmin\AppData\Roaming\rclone\rclone.conf") {
          rclone copy ${{ env.DATA_PATH }} gdrive:khen-data --verbose 2>&1
          Write-Host "✅ Backup ke Google Drive berhasil"
        } else {
          Write-Host "⚠️ rclone.conf tidak ditemukan, skip"
        }
    
    # ==========================================
    # 10. TRIGGER NEXT RUN
    # ==========================================
    - name: Trigger Next Run
      run: |
        $version = "${{ github.event.inputs.version }}"
        $storage = "${{ github.event.inputs.storage }}"
        curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-khen-ultimate.yml/dispatches \
          -d "{\"ref\":\"main\", \"inputs\": {\"version\":\"$version\", \"storage\":\"$storage\"}}"
      continue-on-error: true
