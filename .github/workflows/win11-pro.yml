name: KHEN RDP ULTIMATE

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Pilih versi Windows'
        required: true
        default: 'windows-11-gaming'
        type: choice
        options:
          - windows-11-gaming
          - windows-11-pro
          - windows-10-pro
          - windows-10-22h2
          - windows-8-pro
          - windows-7-pro
      save_data:
        description: 'Simpan data setelah session?'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no
      tunnel:
        description: 'Pilih tunnel utama'
        required: true
        default: 'cloudflare'
        type: choice
        options:
          - cloudflare
          - tailscale
          - both
      duration:
        description: 'Durasi session (jam)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

permissions:
  actions: write
  contents: read

env:
  RDP_USER: KhenzOfficial
  RDP_PASS: KhenzDev#12
  RDP_DOMAIN: rdp.xzen.my.id
  DATA_PATH: C:\khen-data
  GAMING_PATH: D:\games
  DURATION_MINUTES: ${{ fromJSON(format('[60,120,180,240,300,360][{0}]', github.event.inputs.duration)) }}
  KEEP_ALIVE_COUNT: ${{ fromJSON(format('[12,24,36,48,60,72][{0}]', github.event.inputs.duration)) }}

jobs:
  rdp:
    runs-on: ${{ 
      github.event.inputs.windows_version == 'windows-11-gaming' && 'windows-latest' ||
      github.event.inputs.windows_version == 'windows-11-pro' && 'windows-latest' ||
      github.event.inputs.windows_version == 'windows-10-pro' && 'windows-2019' ||
      github.event.inputs.windows_version == 'windows-10-22h2' && 'windows-2022' ||
      github.event.inputs.windows_version == 'windows-8-pro' && 'windows-2022' ||
      github.event.inputs.windows_version == 'windows-7-pro' && 'windows-2022'
    }}
    timeout-minutes: ${{ fromJSON(env.DURATION_MINUTES) }}
    
    steps:
      # ==========================================
      # 1. CHECKOUT & SETUP
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. CLEANUP
      # ==========================================
      - name: Cleanup & Prepare
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Save Data: ${{ github.event.inputs.save_data }}"
          Write-Host "  Tunnel: ${{ github.event.inputs.tunnel }}"
          Write-Host "  Durasi: ${{ github.event.inputs.duration }} jam"
          Write-Host "========================================"
          
          # Cleanup temp files
          $tempPaths = @(
            "C:\Users\runneradmin\AppData\Local\Temp\*",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Windows Kits",
            "C:\Users\runneradmin\.nuget",
            "C:\Program Files\dotnet"
          )
          
          foreach ($path in $tempPaths) {
            if (Test-Path $path) {
              Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          [System.GC]::Collect()
          Write-Host "✅ Cleanup done"

      # ==========================================
      # 3. RESTORE DATA
      # ==========================================
      - name: Restore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DATA_PATH }}
            ${{ env.GAMING_PATH }}
          key: khen-data-${{ github.run_id }}
          restore-keys: |
            khen-data-

      - name: Restore Artifact
        if: github.event.inputs.save_data == 'yes' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
        continue-on-error: true

      # ==========================================
      # 4. SYSTEM INFO
      # ==========================================
      - name: System Info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  SYSTEM INFO"
          Write-Host "========================================"
          Write-Host "Windows : ${{ github.event.inputs.windows_version }}"
          Write-Host "Backup  : ${{ github.event.inputs.save_data }}"
          Write-Host "Tunnel  : ${{ github.event.inputs.tunnel }}"
          Write-Host "========================================"
          
          try {
            Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
            Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, MaxClockSpeed
            $memory = Get-CimInstance -ClassName Win32_PhysicalMemory
            $totalMemory = ($memory | Measure-Object -Property Capacity -Sum).Sum / 1GB
            Write-Host "Total Memory: $([math]::Round($totalMemory, 2)) GB"
            Get-CimInstance -ClassName Win32_VideoController | Select-Object Name, DriverVersion
            Get-PSDrive C | Select-Object Used, Free
          } catch {
            Write-Host "⚠️ Error getting system info: $($_.Exception.Message)"
          }
          Write-Host "========================================"

      # ==========================================
      # 5. GAMING OPTIMIZATION
      # ==========================================
      - name: Gaming Optimization
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  GAMING OPTIMIZATION"
          Write-Host "========================================"
          
          # Power plan - High Performance
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          # Game Mode
          reg add "HKCU\Software\Microsoft\GameBar" /v AllowAutoGameMode /t REG_DWORD /d 1 /f 2>$null
          reg add "HKCU\Software\Microsoft\GameBar" /v AutoGameModeEnabled /t REG_DWORD /d 1 /f 2>$null
          
          # Graphics settings
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers" /v HwSchMode /t REG_DWORD /d 2 /f 2>$null
          
          # Multimedia priority
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" /v "GPU Priority" /t REG_DWORD /d 8 /f 2>$null
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games" /v Priority /t REG_DWORD /d 6 /f 2>$null
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" /v SystemResponsiveness /t REG_DWORD /d 0 /f 2>$null
          
          # Visual effects
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f 2>$null
          reg add "HKCU\Control Panel\Desktop" /v MenuShowDelay /t REG_SZ /d 0 /f 2>$null
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v TaskbarAnimations /t REG_DWORD /d 0 /f 2>$null
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f 2>$null
          
          Write-Host "✅ Gaming Optimization applied"

      # ==========================================
      # 6. INSTALL RENDER ENGINE
      # ==========================================
      - name: Install Render Engine
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  INSTALL RENDER ENGINE"
          Write-Host "========================================"
          
          # Install chocolatey if not present
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          
          $packages = @(
            'directx',
            'vulkan-runtime',
            'opengl',
            'vcredist-all'
          )
          
          foreach ($pkg in $packages) {
            Write-Host "Installing $pkg..."
            choco install $pkg -y --limit-output 2>$null
          }
          
          Write-Host "✅ Render engine installed"

      # ==========================================
      # 7. SETUP RDP
      # ==========================================
      - name: Setup RDP
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  SETUP RDP"
          Write-Host "========================================"
          
          # Random port
          $port = Get-Random -Minimum 40000 -Maximum 49999
          Write-Host "Random Port: $port"
          
          # Enable RDP
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v PortNumber /t REG_DWORD /d $port /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxIdleTime /t REG_DWORD /d 0 /f 2>$null
          
          # RDP Performance
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableWallpaper /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableMenuAnimations /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableFullWindowDrag /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableCursorShadow /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fDisableThemes /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v ColorDepth /t REG_DWORD /d 2 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v CompressionLevel /t REG_DWORD /d 2 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fUseUDP /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableWddmDriver /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableRemoteFx /t REG_DWORD /d 1 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v fEnableH264 /t REG_DWORD /d 1 /f 2>$null
          
          # Anti-Disconnect
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v MaxDisconnectionTime /t REG_DWORD /d 0 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveTimeout /t REG_DWORD /d 0 /f 2>$null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f 2>$null
          
          # Firewall
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=$port 2>$null
          netsh advfirewall firewall add rule name="RDP-UDP" dir=in action=allow protocol=UDP localport=$port 2>$null
          netsh advfirewall firewall add rule name="Steam" dir=in action=allow protocol=TCP localport=27015-27030 2>$null
          netsh advfirewall firewall add rule name="Game" dir=in action=allow protocol=TCP localport=27000-27050 2>$null
          
          # Create user
          net user ${{ env.RDP_USER }} ${{ env.RDP_PASS }} /add /expires:never /passwordchg:no 2>$null
          net localgroup Administrators ${{ env.RDP_USER }} /add 2>$null
          net localgroup "Remote Desktop Users" ${{ env.RDP_USER }} /add 2>$null
          
          # Create directories
          $directories = @(
            "${{ env.DATA_PATH }}",
            "${{ env.DATA_PATH }}\Desktop",
            "${{ env.DATA_PATH }}\Documents",
            "${{ env.DATA_PATH }}\Downloads",
            "${{ env.DATA_PATH }}\Pictures",
            "${{ env.DATA_PATH }}\Music",
            "${{ env.DATA_PATH }}\Videos",
            "${{ env.DATA_PATH }}\SaveGames",
            "${{ env.GAMING_PATH }}",
            "${{ env.GAMING_PATH }}\Steam",
            "${{ env.GAMING_PATH }}\Epic",
            "${{ env.GAMING_PATH }}\GOG",
            "${{ env.GAMING_PATH }}\Rockstar",
            "${{ env.GAMING_PATH }}\Minecraft",
            "${{ env.GAMING_PATH }}\Mods",
            "${{ env.GAMING_PATH }}\Saves"
          )
          
          foreach ($dir in $directories) {
            New-Item -ItemType Directory -Force -Path $dir -ErrorAction SilentlyContinue
          }
          
          # Redirect user folders
          $userPath = "C:\Users\${{ env.RDP_USER }}"
          if (-not (Test-Path $userPath)) {
            New-Item -ItemType Directory -Force -Path $userPath
          }
          
          $folders = @('Desktop','Documents','Downloads','Pictures','Music','Videos','SaveGames')
          foreach ($folder in $folders) {
            $target = "${{ env.DATA_PATH }}\$folder"
            $linkPath = "$userPath\$folder"
            if (Test-Path $linkPath) {
              Remove-Item -Path $linkPath -Force -ErrorAction SilentlyContinue
            }
            cmd /c mklink /J "$linkPath" "$target" 2>$null
          }
          
          # Save port to env
          echo "RDP_PORT=$port" >> $env:GITHUB_ENV
          
          # Create config
          $config = @"
          ============================================================
          KHEN RDP ULTIMATE
          ============================================================
          USER      : ${{ env.RDP_USER }}
          PASS      : ${{ env.RDP_PASS }}
          PORT      : $port
          DATA      : ${{ env.DATA_PATH }}
          GAMES     : ${{ env.GAMING_PATH }}
          WINDOWS   : ${{ github.event.inputs.windows_version }}
          BACKUP    : ${{ github.event.inputs.save_data }}
          TUNNEL    : ${{ github.event.inputs.tunnel }}
          DURASI    : ${{ github.event.inputs.duration }} jam
          STATUS    : ONLINE
          ============================================================
          "@
          $config | Out-File -FilePath "${{ env.DATA_PATH }}\KHEN-CONFIG.txt" -Force
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  RDP GAMING ACTIVE"
          Write-Host "========================================"
          Get-Content "${{ env.DATA_PATH }}\KHEN-CONFIG.txt"
          Write-Host "========================================"
          Write-Host "  RDP PORT: $port"
          Write-Host "========================================"

      # ==========================================
      # 8. CLOUDFLARE TUNNEL
      # ==========================================
      - name: Cloudflare Tunnel
        if: github.event.inputs.tunnel == 'cloudflare' || github.event.inputs.tunnel == 'both'
        id: cloudflare
        continue-on-error: true
        shell: pwsh
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          Write-Host "========================================"
          Write-Host "  CLOUDFLARE TUNNEL"
          Write-Host "========================================"
          
          if (-not $env:CF_TOKEN) {
            Write-Host "⚠️ No Cloudflare token, skip..."
            exit 0
          }
          
          Write-Host "✅ Token ditemukan"
          Write-Host "🔄 Starting tunnel with port: ${{ env.RDP_PORT }}"
          
          # Download cloudflared
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "cloudflared.exe" -UseBasicParsing
          
          # Start cloudflared
          $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:${{ env.RDP_PORT }} --hostname ${{ env.RDP_DOMAIN }} --token $env:CF_TOKEN" -WindowStyle Hidden -PassThru
          
          Start-Sleep -Seconds 15
          
          $running = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue
          if ($running) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "  ✅ CLOUDFLARE TUNNEL ACTIVE"
            Write-Host "========================================"
            Write-Host "HOST : ${{ env.RDP_DOMAIN }}"
            Write-Host "PORT : ${{ env.RDP_PORT }}"
            Write-Host "USER : ${{ env.RDP_USER }}"
            Write-Host "PASS : ${{ env.RDP_PASS }}"
            Write-Host "========================================"
          } else {
            Write-Host "❌ Cloudflare gagal, lanjut ke fallback..."
            exit 1
          }

      # ==========================================
      # 9. TAILSCALE (FALLBACK)
      # ==========================================
      - name: Tailscale VPN
        if: (github.event.inputs.tunnel == 'tailscale' || github.event.inputs.tunnel == 'both') && (steps.cloudflare.outcome == 'failure' || steps.cloudflare.conclusion == 'failure')
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "========================================"
          Write-Host "  TAILSCALE VPN (FALLBACK)"
          Write-Host "========================================"
          
          if (-not $env:TS_AUTHKEY) {
            Write-Host "ERROR: TAILSCALE_AUTH_KEY not set"
            exit 1
          }
          
          Write-Host "Installing Tailscale..."
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart /qn" -Wait
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10
          
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
            Write-Host "ERROR: Tailscale not installed"
            exit 1
          }
          
          Write-Host "Logging in..."
          & $tsPath login --auth-key $env:TS_AUTHKEY
          Start-Sleep -Seconds 5
          
          $ip = & $tsPath ip
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "  ✅ TAILSCALE ACTIVE (FALLBACK)"
          Write-Host "========================================"
          Write-Host "IP   : $ip"
          Write-Host "PORT : ${{ env.RDP_PORT }}"
          Write-Host "USER : ${{ env.RDP_USER }}"
          Write-Host "PASS : ${{ env.RDP_PASS }}"
          Write-Host "========================================"
          Write-Host "⚠️  Akses: $ip`:${{ env.RDP_PORT }}"
          Write-Host "========================================"

      # ==========================================
      # 10. KEEP ALIVE
      # ==========================================
      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  KHEN RDP ULTIMATE AKTIF"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "  AKSES RDP:"
          Write-Host ""
          if ('${{ github.event.inputs.tunnel }}' -eq 'cloudflare' -or '${{ github.event.inputs.tunnel }}' -eq 'both') {
            Write-Host "  Host 1: ${{ env.RDP_DOMAIN }}:${{ env.RDP_PORT }} (Cloudflare)"
          }
          if ('${{ github.event.inputs.tunnel }}' -eq 'tailscale' -or '${{ github.event.inputs.tunnel }}' -eq 'both') {
            Write-Host "  Host 2: (Tailscale IP):${{ env.RDP_PORT }} (Fallback)"
          }
          Write-Host "  User: ${{ env.RDP_USER }}"
          Write-Host "  Pass: ${{ env.RDP_PASS }}"
          Write-Host ""
          Write-Host "  Data   : ${{ env.DATA_PATH }} (PERMANEN)"
          Write-Host "  Games  : ${{ env.GAMING_PATH }} (PERMANEN)"
          Write-Host "  Windows: ${{ github.event.inputs.windows_version }}"
          Write-Host "  Durasi : ${{ github.event.inputs.duration }} jam"
          Write-Host ""
          Write-Host "========================================"
          
          $counter = 0
          $max = ${{ env.KEEP_ALIVE_COUNT }}
          while ($counter -lt $max) {
            $counter++
            $time = Get-Date -Format "HH:mm:ss"
            Write-Host "[$time] KHEN RDP ACTIVE $counter/$max"
            
            if ($counter % 3 -eq 0) {
              try {
                $cpu = (Get-CimInstance -ClassName Win32_Processor).LoadPercentage
                $ram = Get-CimInstance -ClassName Win32_OperatingSystem
                $ramUsed = [math]::Round(($ram.TotalVisibleMemorySize - $ram.FreePhysicalMemory) / 1MB, 2)
                $ramTotal = [math]::Round($ram.TotalVisibleMemorySize / 1MB, 2)
                $disk = Get-PSDrive C
                $diskFree = [math]::Round($disk.Free / 1GB, 2)
                Write-Host "[$time] AUTO CHECK: CPU=$cpu% | RAM=$ramUsed/$ramTotal GB | DISK=$diskFree GB free"
              } catch {
                Write-Host "[$time] ⚠️ Error getting system stats"
              }
            }
            
            Start-Sleep -Seconds 300
          }

      # ==========================================
      # 11. BACKUP
      # ==========================================
      - name: Upload Backup
        if: github.event.inputs.save_data == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: khen-data-backup
          path: ${{ env.DATA_PATH }}
          retention-days: 90

      - name: Upload Backup (Disabled)
        if: github.event.inputs.save_data != 'yes'
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  SKIP BACKUP"
          Write-Host "========================================"
          Write-Host "Save Data = ${{ github.event.inputs.save_data }}"
          Write-Host "========================================"

      # ==========================================
      # 12. AUTO RESTART
      # ==========================================
      - name: Trigger Next Run
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $body = @{
            ref = "main"
            inputs = @{
              windows_version = "${{ github.event.inputs.windows_version }}"
              save_data = "${{ github.event.inputs.save_data }}"
              tunnel = "${{ github.event.inputs.tunnel }}"
              duration = "${{ github.event.inputs.duration }}"
            }
          } | ConvertTo-Json -Depth 3
          
          try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-khen.yml/dispatches" `
              -Method Post `
              -Headers @{
                "Authorization" = "token ${{ secrets.GITHUB_TOKEN }}"
                "Accept" = "application/vnd.github.v3+json"
              } `
              -Body $body `
              -ContentType "application/json"
            Write-Host "✅ Next run triggered"
          } catch {
            Write-Host "⚠️ Gagal trigger: $($_.Exception.Message)"
          }
