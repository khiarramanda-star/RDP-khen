name: KHEN Keep Alive
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Check & Trigger
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp.yml/runs" \
          | jq '.workflow_runs[] | select(.status=="in_progress" or .status=="queued") | .id' | head -1)
        if [ -z "$RUNS" ]; then
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp.yml/dispatches \
            -d '{"ref":"main"}'
          echo "KHEN RDP restarted"
        else
          echo "KHEN RDP is running (ID: $RUNS)"
        fi
