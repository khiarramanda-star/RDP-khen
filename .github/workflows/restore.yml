name: KHEN Restore Data
on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: 'Tanggal backup (yyyy-MM-dd)'
        required: true
        default: '2026-01-09'

jobs:
  restore:
    runs-on: windows-latest
    steps:
    - name: Download Backup
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "khen-backup-${{ github.event.inputs.backup_date }}"
        $release = curl -s -H "Authorization: token $env:GH_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
        if ($release.assets) {
          curl -s -L -o C:\restore.zip $release.assets[0].browser_download_url
          Expand-Archive -Path C:\restore.zip -DestinationPath C:\restore-temp -Force
        }
    
    - name: Upload Restored Data
      uses: actions/upload-artifact@v4
      with:
        name: khen-backup
        path: C:\restore-temp
        retention-days: 90
